<style>
:root {
  color-scheme: dark;
  --bg: #05080f;
  --card: #0b111d;
  --card-hover: #101828;
  --border: #1a2436;
  --text: #eef3ff;
  --muted: #7d8aa3;
  --blue: #4aa8ff;
  --heal: #3ddc84;
  --shield: #6ee7ff;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

html {
  background: var(--bg);
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  -webkit-font-smoothing: antialiased;
}

::selection {
  background: var(--blue);
  color: var(--bg);
}

#stars,
#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#stars {
  z-index: 0;
}

.glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(60% 40% at 50% 0%, rgba(40, 110, 220, .16), transparent 70%);
}

main {
  position: relative;
  z-index: 1;
  box-sizing: border-box;
  display: grid;
  align-content: center;
  gap: 36px;
  max-width: 560px;
  min-height: 100vh;
  margin: 0 auto;
  padding-top: 48px;
  padding-bottom: 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity .3s, transform .3s;
}

h1 {
  margin: 0;
  text-align: center;
  white-space: nowrap;
  font-family: var(--font-display);
  font-size: clamp(30px, 11vw, 72px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.04em;
}

h1 span {
  color: var(--blue);
}

.accounts {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.account {
  position: relative;
  transition: transform .4s cubic-bezier(.25, 1.25, .4, 1);
  animation: fade-in .5s ease-out backwards;
  animation-delay: calc(var(--i) * 50ms);
}

.account:hover,
.account:has(:focus-visible) {
  z-index: 2;
  transform: scale(1.035);
}

.account:active {
  transform: scale(.985);
  transition-duration: .15s;
}

.card {
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  width: 100%;
  margin: 0;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: inherit;
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background .35s, border-color .35s, box-shadow .4s;
}

.account:hover .card,
.card:focus-visible {
  border-color: var(--brand);
  background: var(--card-hover);
  box-shadow: 0 12px 36px -14px color-mix(in srgb, var(--brand) 70%, transparent);
}

.card:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 3px;
}

.logo {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: #131c2d;
  transition: background .35s;
}

.logo svg {
  width: 22px;
  height: 22px;
  fill: var(--text);
  transition: fill .35s, transform .35s;
}

.account:hover .logo {
  background: var(--brand);
}

.account:hover .logo svg {
  fill: var(--brand-text);
  transform: scale(1.1);
}

.info {
  display: grid;
  gap: 6px;
  min-width: 0;
}

.platform {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.handle {
  overflow: hidden;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.handle em {
  color: var(--muted);
  font-style: normal;
}

.action {
  box-sizing: border-box;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--muted);
  transition: background .35s, color .35s, border-color .35s;
}

.action svg {
  width: 16px;
  height: 16px;
  transition: transform .35s;
}

.account:hover .action {
  color: var(--text);
}

.account.link:hover .action {
  border-color: transparent;
  background: var(--brand);
  color: var(--brand-text);
}

.account.link:hover .action svg {
  transform: translate(1px, -1px);
}

.account[hidden],
.more[hidden] {
  display: none;
}

.more {
  justify-self: center;
  margin: -14px 0 0;
  padding: 10px 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--muted);
  font: inherit;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color .35s, border-color .35s, background .35s, transform .4s cubic-bezier(.25, 1.25, .4, 1);
}

.more:hover,
.more:focus-visible {
  border-color: var(--blue);
  background: var(--card-hover);
  color: var(--text);
  transform: scale(1.04);
  outline: none;
}

.hint {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2;
  margin: 0;
  padding: 28px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: linear-gradient(transparent, var(--bg) 70%);
  color: #3a4760;
  font-size: 10px;
  letter-spacing: .16em;
  text-align: center;
  text-transform: uppercase;
  pointer-events: none;
  transition: opacity .3s;
}

body.playing .hint {
  opacity: 0;
  visibility: hidden;
}

.play {
  display: none;
  margin: 0 auto;
  padding: 13px 26px;
  border: 1px solid var(--blue);
  border-radius: 12px;
  background: var(--card-hover);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  letter-spacing: .16em;
  text-transform: uppercase;
  pointer-events: auto;
  box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--blue) 70%, transparent);
  -webkit-tap-highlight-color: transparent;
  transition: transform .2s;
}

.play:active {
  transform: scale(.96);
}

.touch-ui .hint span {
  display: none;
}

.touch-ui .play {
  display: block;
}

.touch-ui main {
  padding-bottom: 110px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  z-index: 70;
  max-width: calc(100vw - 32px);
  overflow: hidden;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card-hover);
  font-size: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
  opacity: 0;
  transform: translate(-50%, 16px);
  pointer-events: none;
  transition: transform .2s ease-out, opacity .2s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.spark {
  position: fixed;
  z-index: 60;
  width: 5px;
  height: 5px;
  border-radius: 1px;
  background: var(--brand);
  pointer-events: none;
  animation: spark .7s cubic-bezier(.1, .7, .3, 1) forwards;
}

@keyframes fade-in {
  from { opacity: 0; }
}

@keyframes spark {
  to {
    opacity: 0;
    transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(0);
  }
}

html.playing,
html.playing body {
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

body.playing {
  cursor: none;
}

body.playing main {
  opacity: 0;
  transform: scale(.97);
  pointer-events: none;
}

#game {
  z-index: 30;
  touch-action: none;
}

.hud {
  position: fixed;
  inset: 0;
  z-index: 31;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}

body.playing .hud {
  opacity: 1;
}

.hud [hidden] {
  display: none;
}

.score {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  left: max(20px, env(safe-area-inset-left, 0px));
  color: var(--text);
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}

.score small {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: .14em;
}

.lives {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  right: max(20px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 6px;
}

.lives i {
  width: 0;
  height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 14px solid var(--blue);
}

.lives i.extra {
  border-bottom-color: var(--shield);
}

.lives i.lost {
  border-bottom-color: var(--border);
}

.lives em {
  margin-right: 6px;
  padding: 2px 6px;
  border: 1px solid currentColor;
  border-radius: 6px;
  color: #ff6ec7;
  font-size: 10px;
  font-style: normal;
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums;
}

.lives b {
  box-sizing: border-box;
  width: 16px;
  height: 16px;
  margin-right: 6px;
  border: 2px solid var(--shield);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--shield);
}

.boss-bar {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 24px);
  left: 50%;
  display: grid;
  gap: 6px;
  width: min(320px, 50vw);
  text-align: center;
  transform: translateX(-50%);
}

.boss-bar div {
  height: 4px;
  overflow: hidden;
  border-radius: 2px;
  background: var(--border);
}

.boss-bar small {
  color: #4b5874;
  font-size: 10px;
}

.boss-bar i {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--blue);
  transition: width .15s;
}

.banner,
.game-over {
  position: absolute;
  left: 50%;
  display: grid;
  gap: 12px;
  text-align: center;
  transform: translate(-50%, -50%);
}

.banner {
  top: 32%;
  opacity: 0;
}

.banner.show {
  animation: banner 3s ease forwards;
}

.banner span {
  color: var(--blue);
}

.game-over {
  top: 50%;
}

.banner b,
.game-over b {
  color: var(--text);
  font-family: var(--font-display);
  font-size: clamp(26px, 7vw, 50px);
  font-weight: 800;
  letter-spacing: -.03em;
  text-transform: none;
}

.game-over small {
  color: #4b5874;
  font-size: inherit;
}

.quit {
  position: absolute;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: none;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--muted);
  font: inherit;
  font-size: 22px;
  line-height: 1;
  pointer-events: auto;
  -webkit-tap-highlight-color: transparent;
}

.controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  text-align: center;
}

@keyframes banner {
  0% { opacity: 0; transform: translate(-50%, -40%); }
  15%, 75% { opacity: 1; transform: translate(-50%, -50%); }
  100% { opacity: 0; transform: translate(-50%, -56%); }
}

@media (max-width: 420px) {
  .card { gap: 12px; padding: 12px; }
  .logo { width: 40px; height: 40px; }
  .handle { font-size: 16px; }
}

.touch-ui .quit { display: grid; }
.touch-ui .controls { padding: 0 64px; }
.touch-ui .account:hover { transform: none; }
.touch-ui .account:active { transform: scale(.985); }
.touch-ui .account:hover .card { border-color: var(--border); background: var(--card); box-shadow: none; }
.touch-ui .account:hover .logo { background: #131c2d; }
.touch-ui .account:hover .logo svg { fill: var(--text); transform: none; }
.touch-ui .account:hover .action,
.touch-ui .account.link:hover .action { border-color: var(--border); background: transparent; color: var(--muted); }
.touch-ui .account.link:hover .action svg { transform: none; }
.touch-ui .more:hover { border-color: var(--border); background: var(--card); color: var(--muted); transform: none; }

.rotate {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  padding: 24px;
  background: rgba(5, 8, 15, .94);
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .14em;
  text-align: center;
  text-transform: uppercase;
}

.rotate[hidden] {
  display: none;
}

.rotate b {
  color: var(--text);
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.02em;
  text-transform: none;
}

.rotate i {
  width: 34px;
  height: 58px;
  margin-bottom: 8px;
  border: 2px solid var(--blue);
  border-radius: 7px;
  animation: turn 2s ease-in-out infinite;
}

@keyframes turn {
  0%, 25% { transform: rotate(0); }
  55%, 100% { transform: rotate(-90deg); }
}

@media (prefers-reduced-motion: reduce) {
  .account,
  .spark {
    animation: none !important;
  }
}
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>

<main>
  <h1 id="name" aria-label="exoflex6">exoflex<span>6</span></h1>
  <ul class="accounts" id="accounts" aria-label="Accounts"></ul>
  <button class="more" id="more" type="button" hidden></button>
</main>

<div class="hint"><span>Click empty space to play</span><button class="play" id="play" type="button">Play the game</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<canvas id="game" aria-hidden="true"></canvas>
<div class="hud" aria-live="polite">

  <div class="lives" id="lives"></div>
  <div class="boss-bar" id="boss-bar" hidden><span id="boss-name">Mothership</span><div><i id="boss-health"></i></div><small id="boss-note">Defeat it to continue</small></div>

  <i></i>
  <b>Rotate your phone</b>
  <span>The game plays in landscape</span>
</div>

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const random = (min, max) => min + Math.random() * (max - min);

function scrambleTitle() {
  const title = document.getElementById("name");
  const text = "exoflex6";
  const glyphs = "#/<>_=+*0123456789XO";
  const frames = 18;
  let frame = 0;

  const tick = () => {
    frame++;
    const revealed = Math.floor((frame / frames) * text.length);
    const chars = [...text].map((c, i) => i < revealed ? c : glyphs[Math.floor(Math.random() * glyphs.length)]);
    title.innerHTML = chars.slice(0, 7).join("") + `<span>${chars[7]}</span>`;
    if (frame < frames) setTimeout(tick, 35);
  };
  tick();
}

const toast = document.getElementById("toast");
let toastTimer;

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1700);
}

function sparks(x, y, color) {
  if (reducedMotion) return;

  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12 + Math.random() * .4;
    const dist = random(30, 70);
    const spark = document.createElement("span");
    spark.className = "spark";
    spark.style.cssText = `left:${x - 2}px; top:${y - 2}px; --brand:${color}; --dx:${Math.cos(angle) * dist}px; --dy:${Math.sin(angle) * dist}px; --r:${Math.random() * 360}deg`;
    document.body.appendChild(spark);
    setTimeout(() => spark.remove(), 750);
  }
}

function copyFallback(text) {
  try {
    const input = document.createElement("textarea");
    input.value = text;
    input.setAttribute("readonly", "");
    input.style.cssText = "position: fixed; opacity: 0";
    document.body.appendChild(input);
    input.select();
    const ok = document.execCommand("copy");
    input.remove();
    return ok;
  } catch {
    return false;
  }
}

function copyName(account, x, y) {
  const text = account.name + (account.tag || "");
  const copied = () => showToast(`Copied ${text}`);
  const failed = () => showToast(`${account.platform}: ${text}`);

  sparks(x, y, account.brand);
  try {
    navigator.clipboard.writeText(text).then(copied, () => copyFallback(text) ? copied() : failed());
  } catch {
    copyFallback(text) ? copied() : failed();
  }
}

function renderAccounts() {
  const list = document.getElementById("accounts");

  ACCOUNTS.forEach((account, i) => {
    const fullName = account.name + (account.tag || "");
    const inner = `
      <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[account.icon]}"/></svg></span>
      <span class="info">
        <span class="platform">${account.platform}</span>
        <span class="handle">${account.name}${account.tag ? `<em>${account.tag}</em>` : ""}</span>
      </span>
      <span class="action" aria-hidden="true">${account.url ? ARROW_ICON : COPY_ICON}</span>`;

    const item = document.createElement("li");
    item.className = account.url ? "account link" : "account";
    item.style.cssText = `--brand:${account.brand}; --brand-text:${account.brandText}; --i:${i % VISIBLE_AT_START}`;
    item.hidden = i >= VISIBLE_AT_START;

    if (account.url) {
      item.innerHTML = `<a class="card" href="${account.url}" target="_blank" rel="noopener" aria-label="Open ${account.platform} profile">${inner}</a>`;
    } else {
      item.innerHTML = `<button class="card" type="button" aria-label="Copy ${account.platform} name ${fullName}">${inner}</button>`;
      const button = item.querySelector("button");
      button.addEventListener("click", (e) => {
        const box = button.getBoundingClientRect();
        copyName(account, e.clientX || box.left + box.width / 2, e.clientY || box.top + box.height / 2);
      });
    }

    list.appendChild(item);
  });

  const extra = ACCOUNTS.length - VISIBLE_AT_START;
  const more = document.getElementById("more");
  if (extra <= 0) return;

  more.textContent = `List ${extra} more`;
  more.hidden = false;
  more.addEventListener("click", () => {
    for (const item of list.children) item.hidden = false;
    more.remove();
  });
}

function startStars() {
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let width, height, dpr;
  let stars = [];
  let meteors = [];
  let parallaxX = 0, parallaxY = 0, mouseX = 0, mouseY = 0;

  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    width = canvas.width = innerWidth * dpr;
    height = canvas.height = innerHeight * dpr;

    const count = Math.round((innerWidth * innerHeight) / 3200);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      depth: Math.random() ** 2.2,
      phase: Math.random() * 7,
      twinkle: random(.6, 2.2),
    }));

    if (reducedMotion) draw(0);
  }

  function draw(time) {
    ctx.clearRect(0, 0, width, height);
    parallaxX += (mouseX - parallaxX) * .04;
    parallaxY += (mouseY - parallaxY) * .04;

    for (const star of stars) {
      const x = (((star.x - parallaxX * 50 * dpr * star.depth) % width) + width) % width;
      const y = (((star.y - parallaxY * 50 * dpr * star.depth + time * .003 * star.depth * dpr) % height) + height) % height;
      const twinkle = reducedMotion ? 1 : .6 + .4 * Math.sin(time * .001 * star.twinkle + star.phase);
      ctx.fillStyle = `rgba(205, 225, 255, ${(.2 + star.depth * .7) * twinkle})`;
      ctx.beginPath();
      ctx.arc(x, y, (.35 + star.depth * 1.3) * dpr, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const m of meteors) {
      m.age++;
      const x = m.x + m.vx * m.age;
      const y = m.y + m.vy * m.age;
      const tail = ctx.createLinearGradient(x, y, x - m.vx * 12, y - m.vy * 12);
      tail.addColorStop(0, `rgba(210, 230, 255, ${(1 - m.age / m.lifetime) * .8})`);
      tail.addColorStop(1, "rgba(210, 230, 255, 0)");
      ctx.strokeStyle = tail;
      ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - m.vx * 12, y - m.vy * 12);
      ctx.stroke();
    }
    meteors = meteors.filter((m) => m.age < m.lifetime);
  }

  function shootingStar() {
    const angle = Math.PI * random(.15, .27);
    const speed = random(9, 15) * dpr;
    meteors.push({
      x: Math.random() * width * .8,
      y: Math.random() * height * .4,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      age: 0,
      lifetime: random(50, 80),
    });
    setTimeout(shootingStar, random(5000, 12000));
  }

  addEventListener("resize", resize);
  addEventListener("pointermove", (e) => {
    mouseX = e.clientX / innerWidth - .5;
    mouseY = e.clientY / innerHeight - .5;
  });

  resize();
  if (reducedMotion) return;

  const frame = (time) => {
    if (!document.hidden) draw(time);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  setTimeout(shootingStar, 2500);
}
