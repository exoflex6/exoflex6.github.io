<style>
:root {
  color-scheme: dark;
  --bg: #05080f;
  --card: #0b111d;
  --card-hover: #101828;
  --border: #1a2436;
  --text: #eef3ff;
  --muted: #7d8aa3;
  --blue: #4aa8ff;
  --heal: #3ddc84;
  --shield: #6ee7ff;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

html {
  background: var(--bg);
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  -webkit-font-smoothing: antialiased;
}

::selection {
  background: var(--blue);
  color: var(--bg);
}

#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#stars {
  z-index: 0;
}

.glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(60% 40% at 50% 0%, rgba(40, 110, 220, .16), transparent 70%);
}

main {
  position: relative;
  z-index: 1;
  box-sizing: border-box;
  display: grid;
  align-content: center;
  gap: 36px;
  max-width: 560px;
  min-height: 100vh;
  margin: 0 auto;
  padding-top: 48px;
  padding-bottom: 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity .3s, transform .3s;
}

h1 {
  margin: 0;
  text-align: center;
  white-space: nowrap;
  font-family: var(--font-display);
  font-size: clamp(30px, 11vw, 72px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.04em;
}

h1 span {
  color: var(--blue);
}

.accounts {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.account {
  position: relative;
  transition: transform .4s cubic-bezier(.25, 1.25, .4, 1);
  animation: fade-in .5s ease-out backwards;
  animation-delay: calc(var(--i) * 50ms);
}

.account:hover,
.account:has(:focus-visible) {
  z-index: 2;
  transform: scale(1.035);
}

.account:active {
  transform: scale(.985);
  transition-duration: .15s;
}

.card {
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  width: 100%;
  margin: 0;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: inherit;
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background .35s, border-color .35s, box-shadow .4s;
}

.account:hover .card,
.card:focus-visible {
  border-color: var(--brand);
  background: var(--card-hover);
  box-shadow: 0 12px 36px -14px color-mix(in srgb, var(--brand) 70%, transparent);
}

.card:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 3px;
}

.logo {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: #131c2d;
  transition: background .35s;
}

.logo svg {
  width: 22px;
  height: 22px;
  fill: var(--text);
  transition: fill .35s, transform .35s;
}

.account:hover .logo {
  background: var(--brand);
}

.account:hover .logo svg {
  fill: var(--brand-text);
  transform: scale(1.1);
}

.info {
  display: grid;
  gap: 6px;
  min-width: 0;
}

.platform {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.handle {
  overflow: hidden;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.handle em {
  color: var(--muted);
  font-style: normal;
}

.action {
  box-sizing: border-box;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--muted);
  transition: background .35s, color .35s, border-color .35s;
}

.action svg {
  width: 16px;
  height: 16px;
  transition: transform .35s;
}

.account:hover .action {
  color: var(--text);
}

.account.link:hover .action {
  border-color: transparent;
  background: var(--brand);
  color: var(--brand-text);
}

.account.link:hover .action svg {
  transform: translate(1px, -1px);
}

.account[hidden],
.more[hidden] {
  display: none;
}

.more {
  justify-self: center;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin: -14px 0 0;
  padding: 10px 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  color: var(--muted);
  font: inherit;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color .35s, border-color .35s, background .35s, transform .4s cubic-bezier(.25, 1.25, .4, 1);
}

.more svg {
  width: 13px;
  height: 13px;
  transition: transform .4s cubic-bezier(.25, 1.25, .4, 1);
}

.more:hover svg,
.more:focus-visible svg {
  transform: translateY(2px);
}

.more:hover,
.more:focus-visible {
  border-color: var(--blue);
  background: var(--card-hover);
  color: var(--text);
  transform: scale(1.04);
  outline: none;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  z-index: 70;
  max-width: calc(100vw - 32px);
  overflow: hidden;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card-hover);
  font-size: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
  opacity: 0;
  transform: translate(-50%, 16px);
  pointer-events: none;
  transition: transform .2s ease-out, opacity .2s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.spark {
  position: fixed;
  z-index: 60;
  width: 5px;
  height: 5px;
  border-radius: 1px;
  background: var(--brand);
  pointer-events: none;
  animation: spark .7s cubic-bezier(.1, .7, .3, 1) forwards;
}

@keyframes fade-in {
  from { opacity: 0; }
}

@keyframes spark {
  to {
    opacity: 0;
    transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(0);
  }
}

@media (max-width: 420px) {
  .card { gap: 12px; padding: 12px; }
  .logo { width: 40px; height: 40px; }
  .handle { font-size: 16px; }
}
.touch-ui .account:hover { transform: none; }
.touch-ui .account:active { transform: scale(.985); }
.touch-ui .account:hover .card { border-color: var(--border); background: var(--card); box-shadow: none; }
.touch-ui .account:hover .logo { background: #131c2d; }
.touch-ui .account:hover .logo svg { fill: var(--text); transform: none; }
.touch-ui .account:hover .action,
.touch-ui .account.link:hover .action { border-color: var(--border); background: transparent; color: var(--muted); }
.touch-ui .account.link:hover .action svg { transform: none; }
.touch-ui .more:hover { border-color: var(--border); background: var(--card); color: var(--muted); transform: none; }
.touch-ui .more:hover svg { transform: none; }

/* Touch: a tap plays the full hover state briefly instead of sticky hover */
.touch-ui .account.tapped { z-index: 2; transform: scale(1.035); }
.touch-ui .account.tapped:active { transform: scale(.985); }
.touch-ui .account.tapped .card {
  border-color: var(--brand);
  background: var(--card-hover);
  box-shadow: 0 12px 36px -14px color-mix(in srgb, var(--brand) 70%, transparent);
}
.touch-ui .account.tapped .logo { background: var(--brand); }
.touch-ui .account.tapped .logo svg { fill: var(--brand-text); transform: scale(1.1); }
.touch-ui .account.tapped .action { color: var(--text); }
.touch-ui .account.link.tapped .action { border-color: transparent; background: var(--brand); color: var(--brand-text); }
.touch-ui .account.link.tapped .action svg { transform: translate(1px, -1px); }

@media (prefers-reduced-motion: reduce) {
  .account,
  .spark {
    animation: none !important;
  }
}
</style>

  <ul class="accounts" id="accounts" aria-label="Accounts"></ul>

</main>

const VISIBLE_AT_START = 5;

const ARROW_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11 11 5M6 5h5v5"/></svg>';
const MORE_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>';
const COPY_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5.5" y="5.5" width="7.5" height="7.5" rx="1.5"/><path d="M3 10.5V4a1 1 0 0 1 1-1h6.5"/></svg>';

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const random = (min, max) => min + Math.random() * (max - min);

function scrambleTitle() {
  const title = document.getElementById("name");
  const text = "exoflex6";
  const glyphs = "#/<>_=+*0123456789XO";
  const frames = 18;
  let frame = 0;

  const tick = () => {
    frame++;
    const revealed = Math.floor((frame / frames) * text.length);
    const chars = [...text].map((c, i) => i < revealed ? c : glyphs[Math.floor(Math.random() * glyphs.length)]);
    title.innerHTML = chars.slice(0, 7).join("") + `<span>${chars[7]}</span>`;
    if (frame < frames) setTimeout(tick, 35);
  };
  tick();
}

const toast = document.getElementById("toast");
let toastTimer;

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1700);
}

function sparks(x, y, color) {
  if (reducedMotion) return;

  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12 + Math.random() * .4;
    const dist = random(30, 70);
    const spark = document.createElement("span");
    spark.className = "spark";
    spark.style.cssText = `left:${x - 2}px; top:${y - 2}px; --brand:${color}; --dx:${Math.cos(angle) * dist}px; --dy:${Math.sin(angle) * dist}px; --r:${Math.random() * 360}deg`;
    document.body.appendChild(spark);
    setTimeout(() => spark.remove(), 750);
  }
}

function copyFallback(text) {
  try {
    const input = document.createElement("textarea");
    input.value = text;
    input.setAttribute("readonly", "");
    input.style.cssText = "position: fixed; opacity: 0";
    document.body.appendChild(input);
    input.select();
    const ok = document.execCommand("copy");
    input.remove();
    return ok;
  } catch {
    return false;
  }
}

function copyName(account, x, y) {
  const text = account.name + (account.tag || "");
  const copied = () => showToast(`Copied ${text}`);
  const failed = () => showToast(`${account.platform}: ${text}`);

  sparks(x, y, account.brand);
  try {
    navigator.clipboard.writeText(text).then(copied, () => copyFallback(text) ? copied() : failed());
  } catch {
    copyFallback(text) ? copied() : failed();
  }
}

function renderAccounts() {
  const list = document.getElementById("accounts");

  ACCOUNTS.forEach((account, i) => {
    const fullName = account.name + (account.tag || "");
    const inner = `
      <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[account.icon]}"/></svg></span>
      <span class="info">
        <span class="platform">${account.platform}</span>
        <span class="handle">${account.name}${account.tag ? `<em>${account.tag}</em>` : ""}</span>
      </span>
      <span class="action" aria-hidden="true">${account.url ? ARROW_ICON : COPY_ICON}</span>`;

    const item = document.createElement("li");
    item.className = account.url ? "account link" : "account";
    item.style.cssText = `--brand:${account.brand}; --brand-text:${account.brandText}; --i:${i % VISIBLE_AT_START}`;
    item.hidden = i >= VISIBLE_AT_START;

    if (account.url) {
      item.innerHTML = `<a class="card" href="${account.url}" target="_blank" rel="noopener" aria-label="Open ${account.platform} profile">${inner}</a>`;
    } else {
      item.innerHTML = `<button class="card" type="button" aria-label="Copy ${account.platform} name ${fullName}">${inner}</button>`;
      const button = item.querySelector("button");
      button.addEventListener("click", (e) => {
        const box = button.getBoundingClientRect();
        copyName(account, e.clientX || box.left + box.width / 2, e.clientY || box.top + box.height / 2);
      });
    }

    list.appendChild(item);
  });

  const extra = ACCOUNTS.length - VISIBLE_AT_START;
  const more = document.getElementById("more");
  if (extra <= 0) return;

  more.innerHTML = `<span>List ${extra} more</span>${MORE_ICON}`;
  more.hidden = false;
  more.addEventListener("click", () => {
    for (const item of list.children) item.hidden = false;
    more.remove();
  });
}

function startStars() {
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let width, height, dpr;
  let stars = [];
  let meteors = [];
  let parallaxX = 0, parallaxY = 0, mouseX = 0, mouseY = 0;

  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    width = canvas.width = innerWidth * dpr;
    height = canvas.height = innerHeight * dpr;

    const count = Math.round((innerWidth * innerHeight) / 3200);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      depth: Math.random() ** 2.2,
      phase: Math.random() * 7,
      twinkle: random(.6, 2.2),
    }));

    if (reducedMotion) draw(0);
  }

  function draw(time) {
    ctx.clearRect(0, 0, width, height);
    parallaxX += (mouseX - parallaxX) * .04;
    parallaxY += (mouseY - parallaxY) * .04;

    for (const star of stars) {
      const x = (((star.x - parallaxX * 50 * dpr * star.depth) % width) + width) % width;
      const y = (((star.y - parallaxY * 50 * dpr * star.depth + time * .003 * star.depth * dpr) % height) + height) % height;
      const twinkle = reducedMotion ? 1 : .6 + .4 * Math.sin(time * .001 * star.twinkle + star.phase);
      ctx.fillStyle = `rgba(205, 225, 255, ${(.2 + star.depth * .7) * twinkle})`;
      ctx.beginPath();
      ctx.arc(x, y, (.35 + star.depth * 1.3) * dpr, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const m of meteors) {
      m.age++;
      const x = m.x + m.vx * m.age;
      const y = m.y + m.vy * m.age;
      const tail = ctx.createLinearGradient(x, y, x - m.vx * 12, y - m.vy * 12);
      tail.addColorStop(0, `rgba(210, 230, 255, ${(1 - m.age / m.lifetime) * .8})`);
      tail.addColorStop(1, "rgba(210, 230, 255, 0)");
      ctx.strokeStyle = tail;
      ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - m.vx * 12, y - m.vy * 12);
      ctx.stroke();
    }
    meteors = meteors.filter((m) => m.age < m.lifetime);
  }

  function shootingStar() {
    const angle = Math.PI * random(.15, .27);
    const speed = random(9, 15) * dpr;
    meteors.push({
      x: Math.random() * width * .8,
      y: Math.random() * height * .4,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      age: 0,
      lifetime: random(50, 80),
    });
    setTimeout(shootingStar, random(5000, 12000));
  }

  addEventListener("resize", resize);
  addEventListener("pointermove", (e) => {
    mouseX = e.clientX / innerWidth - .5;
    mouseY = e.clientY / innerHeight - .5;
  });

  resize();
  if (reducedMotion) return;

  const frame = (time) => {
    if (!document.hidden) draw(time);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  setTimeout(shootingStar, 2500);
}

function trackInput() {
  let mode = matchMedia("(hover: none)").matches ? "touch" : "mouse";
  const set = (type) => {
    mode = type;
    document.documentElement.classList.toggle("touch-ui", type === "touch");
  };
  set(mode);
  addEventListener("pointerdown", (e) => {
    if (e.pointerType !== mode) set(e.pointerType);
  });
  let tapped = null, tapTimer;
  document.getElementById("accounts").addEventListener("click", (e) => {
    const item = e.target.closest(".account");
    if (mode !== "touch" || !item) return;
    if (tapped && tapped !== item) tapped.classList.remove("tapped");
    tapped = item;
    item.classList.add("tapped");
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => item.classList.remove("tapped"), 900);
  });
  addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse" && mode === "touch" && Math.abs(e.movementX) + Math.abs(e.movementY) > 2) set("mouse");
  });
}

if (!reducedMotion) scrambleTitle();
renderAccounts();
startStars();
trackInput();
</script>
