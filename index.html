      levelStep: POINTS_PER_LEVEL,
      lastBossHealth: 0,
      bossActive: null,
      bossPending: null,
      endlessBossAt: Infinity,
      twinTurn: -1,
      twinClock: 2,
      twinShots: 0,
      endlessBosses: 0,
      bossBag: [],
      lastBoss: null,
      pincerCooldown: 8,
      titleTimer: TITLE_TIME,
      spawnTimer: 0,
      shieldTimer: random(240, 360),
      weaponTimer: random(180, 260),
      weapon: null,
      healthTimer: Infinity,
      invincible: 1.2,
      shake: 0,
      over: false,
      distanceMoved: 0,
      lastShot: 0,
      lastMove: 0,
    };

    ui.gameOver.hidden = true;
    ui.bossBar.hidden = true;
    updateHud();
    showBanner("Level 1", usingTouch() ? "Drag to fly and shoot" : "Move to fly and shoot");

    lastTime = performance.now();
    frameId = requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
    cancelAnimationFrame(frameId);
    document.body.classList.remove("playing");
    document.documentElement.classList.remove("playing");
    ui.rotate.hidden = true;
    ui.banner.classList.remove("show");
    ctx.clearRect(0, 0, width, height);
  }


  function nextLevel() {
    const s = state;
    s.level++;
    s.nextLevelAt += s.levelStep;
    s.titleTimer = TITLE_TIME;

    const bossKind = BOSS_LEVELS[s.level];
    const newEnemy = Object.values(ENEMIES).find((e) => e.level === s.level);
    let subtitle = "";
    if (bossKind) {
      s.bossPending = bossKind;
      subtitle = `Boss: ${BOSSES[bossKind].name}`;
    } else if (newEnemy) {
      s.introduce = Object.keys(ENEMIES).find((kind) => ENEMIES[kind] === newEnemy);
      subtitle = `New enemy: ${newEnemy.name} · ${newEnemy.hint}`;
    } else if (s.level === 6) {
      subtitle = "Twin cannons online";
    }
    if (s.level === TRIPLE_FROM_LEVEL) subtitle = "Triple cannons online" + (subtitle ? ` \u00b7 ${subtitle}` : "");
    if (s.level === PENTA_FROM_LEVEL) subtitle = "Pentashot online" + (subtitle ? ` \u00b7 ${subtitle}` : "");
    showBanner(`Level ${s.level}`, subtitle);
  }

  function checkProgress() {
    const s = state;
    if (s.bossActive || s.bossPending || s.over) return;

    if (s.level === Infinity) {
      if (s.score >= s.endlessBossAt) {
        if (!s.bossBag.length) {
          s.bossBag = Object.keys(BOSSES).sort(() => Math.random() - .5);
          if (s.bossBag[s.bossBag.length - 1] === s.lastBoss) s.bossBag.unshift(s.bossBag.pop());
        }
        s.bossPending = s.bossBag.pop();
        s.titleTimer = TITLE_TIME;
        showBanner("Level ∞", `Boss: ${BOSSES[s.bossPending].name}`);
      }
      return;
    }

    if (s.score >= s.nextLevelAt) nextLevel();
  }


  function offscreenPoint(margin = 40) {
    const side = Math.floor(Math.random() * 4);
    return {
      x: side === 0 ? -margin : side === 1 ? width + margin : random(0, width),
      y: side === 2 ? -margin : side === 3 ? height + margin : random(0, height),
    };
  }

  function pickEnemy() {
    const lvl = Math.min(state.spawnLevel, MAX_LEVEL);
    const options = Object.entries(ENEMIES).filter(([, e]) => lvl >= e.level);
    const weight = (e) => e.weight(lvl) * (e.level === lvl ? 4 : 1);
    let roll = Math.random() * options.reduce((sum, [, e]) => sum + weight(e), 0);
    for (const [kind, e] of options) {
      roll -= weight(e);
      if (roll <= 0) return kind;
    }
    return "rock";
  }

  function makeRock(x, y, radius, vx, vy, shape) {
    const hp = radius > 30 ? 2 : 1;
    return {
      kind: "rock", x, y, vx, vy, radius, hp, maxHp: hp,
      shape: shape || Array.from({ length: 9 + Math.floor(Math.random() * 4) }, () => random(.72, 1.08)),
      rotation: random(0, TAU),
      spin: random(-1.4, 1.4),
      age: 0,
    };
  }

  function makeEnemy(kind, x, y) {
    const type = ENEMIES[kind];
    const enemy = {
      kind, x, y, vx: 0, vy: 0,
      radius: type.radius, hp: type.hp, maxHp: type.hp, color: type.color,
      rotation: 0, spin: 0, age: 0,
      cooldown: random(1, 2.2), timer: 0, state: "idle",
    };
    state.enemies.push(enemy);
    return enemy;
  }

  function spawnEnemy(forced) {
    const s = state;
    const kind = forced || pickEnemy();
    const { x, y } = offscreenPoint();
    const lvl = scaledLevel();

    if (kind === "rock") {
      const aim = Math.atan2(random(height * .2, height * .8) - y, random(width * .2, width * .8) - x);
      const speed = random(50, 110) + lvl * 8;
      s.enemies.push(makeRock(x, y, random(18, 40), Math.cos(aim) * speed, Math.sin(aim) * speed));
      return;
    }

    if (kind === "swarm") {
      for (let i = 0; i < 5; i++) {
        makeEnemy("swarm", x + random(-30, 30), y + random(-30, 30)).phase = random(0, TAU);
      }
      return;
    }

    const enemy = makeEnemy(kind, x, y);

    if (kind === "dart") {
      const aim = Math.atan2(s.ship.y - y, s.ship.x - x);
      const speed = 300 + lvl * 15;
      enemy.vx = Math.cos(aim) * speed;
      enemy.vy = Math.sin(aim) * speed;
      enemy.rotation = aim;
    }

    if (kind === "miner") {
      const aim = Math.atan2(random(height * .2, height * .8) - y, random(width * .2, width * .8) - x);
      enemy.vx = Math.cos(aim) * 70;
      enemy.vy = Math.sin(aim) * 70;
    }

    if (kind === "orbiter") {
      enemy.orbit = Math.atan2(y - s.ship.y, x - s.ship.x);
      enemy.direction = Math.random() < .5 ? 1 : -1;
    }
  }

  function spawnBoss(kind) {
    const s = state;
    const def = BOSSES[kind];
    const parts = kind === "twins" ? 2 : 1;
    const total = Math.max(def.hp * parts, Math.ceil(s.lastBossHealth * BOSS_HEALTH_GROWTH));
    const hp = Math.ceil(total / parts);
    s.lastBossHealth = hp * parts;
    const make = (x, y, extra = {}) => {
      const boss = {
        kind: "boss", bossKind: kind, x, y, vx: 0, vy: 0,
        radius: def.radius, hp, maxHp: hp, color: def.color, sides: def.sides,
        rotation: 0, spin: .4, age: 0, cooldown: 2, timer: 2.5, timer2: 5, state: "idle",
        spiral: 0, fade: 1, phase: 1, move: 0,
        homeX: width / 2, homeY: Math.min(150, height * .24),
        ...extra,
      };
      s.enemies.push(boss);
      return boss;
    };

    if (kind === "twins") {
      make(-80, height * .3, { side: -1, color: "#ff4d6d" });
      make(width + 80, height * .7, { side: 1, color: "#4aa8ff" });
      s.twinClock = 3;
    } else {
      make(width / 2, -110);
    }

    s.bossActive = kind;
    s.lastBoss = kind;
    s.coreStage = 0;
    s.barHiddenFor = 0;
    ui.bossHealth.style.background = "";
    ui.bossName.textContent = def.name;
    ui.bossNote.textContent = s.level === Infinity ? "Endless mode" : kind === "twins" ? "Defeat them to continue" : "Defeat it to continue";
    ui.bossHealth.style.width = "100%";
    ui.bossBar.hidden = false;
  }

  function bossDefeated(kind, x, y) {
    const s = state;
    const def = BOSSES[kind];
    s.bossActive = null;
    ui.bossBar.hidden = true;
    s.score += def.points;
    s.shake = 20;
    s.lasers = [];
    s.levelStep += LEVEL_POINTS_GROWTH;
    if (s.level === Infinity || kind === "core") s.endlessBosses++;

    if (Math.random() < .25 * powerBoost()) dropPowerup(x - 16, y, "health");
    if (Math.random() < .05 * powerBoost()) dropPowerup(x + 16, y, "shield");
    for (const kind of Object.keys(WEAPONS)) {
      if (Math.random() < WEAPONS[kind].bossDrop * powerBoost()) dropPowerup(x, y + 20, kind);
    }

    if (kind === "core" && s.level !== Infinity) {
      s.level = Infinity;
      s.spawnLevel = MAX_LEVEL;
      s.endlessBossAt = s.score + Math.max(ENDLESS_BOSS_EVERY, s.levelStep * 4);
      s.titleTimer = TITLE_TIME;
      s.healthTimer = random(40, 80);
      showBanner("Level ∞", "The Core is down. Endless mode");
    } else if (s.level === Infinity) {
      s.endlessBossAt = s.score + Math.max(ENDLESS_BOSS_EVERY, s.levelStep * 4);
      showBanner(`${def.name} down`, `+${def.points}`);
    } else {
      s.nextLevelAt = s.score + s.levelStep;
      showBanner(`${def.name} down`, `+${def.points}`);
    }
    updateHud();
  }


  function canDropHealth() {
    return state.level >= 3 && state.lives < MAX_LIVES;
  }

  function canDropShield() {
    const onScreen = state.powerups.filter((p) => p.kind === "shield").length;
    return onScreen < (state.ship.shield ? 2 : 3);
  }

  function canDropWeapon(kind) {
    const s = state;
    return s.level >= WEAPONS[kind].from && !s.weapon && !s.powerups.some((p) => WEAPONS[p.kind]);
  }

  function dropPowerup(x, y, kind) {
    const allowed = WEAPONS[kind] ? canDropWeapon(kind) : { health: canDropHealth, shield: canDropShield }[kind]();
    if (!allowed) return;
    const angle = random(0, TAU);
    state.powerups.push({ kind, x, y, vx: Math.cos(angle) * 30, vy: Math.sin(angle) * 30, age: 0, lifetime: 9 });
  }

  function collectPowerup(p) {
    const s = state;
    const color = POWER_COLORS[p.kind];
    explode(p.x, p.y, color, 18, 180);

    if (p.kind === "health" && s.lives < MAX_LIVES) {
      s.lives++;
      floatText(p.x, p.y - 20, s.lives > START_LIVES ? "+1 Extra life" : "+1 Life", color);
    } else if (p.kind === "shield" && !s.ship.shield) {
      s.ship.shield = true;
      floatText(p.x, p.y - 20, "Shield", color);
    } else if (WEAPONS[p.kind] && !s.weapon) {
      s.weapon = { kind: p.kind, time: WEAPONS[p.kind].time };
      floatText(p.x, p.y - 20, WEAPONS[p.kind].name, color);
    } else {
      s.score += 50;
      floatText(p.x, p.y - 20, "+50", color);
    }
    checkProgress();
    updateHud();
  }


  function explode(x, y, color, count, speed = 260) {
    for (let i = 0; i < count; i++) {
      const angle = random(0, TAU);
      const v = random(.2, 1) * speed;
      state.particles.push({ x, y, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v, life: random(.35, .8), maxLife: .8, color, size: random(1.2, 2.8) });
    }
  }

  function fire(now) {
    const { ship, weapon } = state;
    let spread = [0];
    if (state.level >= 6) spread = [-.08, .08];
    if (state.level >= TRIPLE_FROM_LEVEL) spread = [-.14, 0, .14];
    if (state.level >= PENTA_FROM_LEVEL) spread = [-.28, -.14, 0, .14, .28];
    if (weapon?.kind === "starburst") spread = Array.from({ length: 12 }, (_, i) => (i * TAU) / 12);
    for (const offset of spread) {
      const angle = ship.angle + offset;
      state.bullets.push({
        x: ship.x + Math.cos(ship.angle) * 14,
        y: ship.y + Math.sin(ship.angle) * 14,
        vx: Math.cos(angle) * 980,
        vy: Math.sin(angle) * 980,
        life: .9,
      });
    }
    state.lastShot = now;
  }

  function enemyFire(enemy, angle, speed) {
    state.enemyShots.push({
      x: enemy.x + Math.cos(angle) * enemy.radius,
      y: enemy.y + Math.sin(angle) * enemy.radius,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 6,
      color: enemy.color,
      breakable: BREAKABLE_SHOTS.has(enemy.kind),
    });
  }

  function spread(enemy, angle, count, step, speed) {
    for (let i = 0; i < count; i++) enemyFire(enemy, angle + (i - (count - 1) / 2) * step, speed);
  }

  function ring(enemy, count, speed, offset = 0, gap = 0) {
    for (let i = gap; i < count; i++) enemyFire(enemy, offset + (i / count) * TAU, speed);
  }

  function addLaser(owner, angle, pincer = false, extra = {}) {
    state.lasers.push({ owner, angle, warn: pincer ? 1.6 : 1, fire: pincer ? .6 : .5, width: owner.radius * 2, pincer, ...extra });
  }

  function spawnWave(x, y, gapCount, color, offset = random(0, TAU), gapSize = .62) {
    const gaps = Array.from({ length: gapCount }, (_, i) => offset + (i * TAU) / gapCount);
    state.hazards.push({ type: "wave", x, y, radius: 30, speed: 150, width: 16, gaps, gapSize, color });
  }

  function strikesAround(x, y, count, color) {
    const offset = random(0, TAU);
    for (let i = 0; i < count; i++) {
      const angle = offset + (i / Math.max(1, count - 1)) * TAU;
      const dist = i === 0 ? 0 : random(170, 240);
      state.hazards.push({ type: "strike", x: x + Math.cos(angle) * dist, y: y + Math.sin(angle) * dist, radius: 72, timer: 1.3, max: 1.3, color });
    }
  }

  function hasLaser(owner) {
    return state.lasers.some((l) => l.owner === owner);
  }

  function hitShip() {
    const s = state;

    if (s.ship.shield) {
      s.ship.shield = false;
      s.invincible = 2.2;
      s.shake = 8;
      for (const shot of s.enemyShots) {
        if ((shot.x - s.ship.x) ** 2 + (shot.y - s.ship.y) ** 2 < 140 ** 2) shot.life = 0;
      }
      for (const e of s.enemies) {
        if (e.kind === "boss" || e.dead) continue;
        const dx = e.x - s.ship.x, dy = e.y - s.ship.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < e.radius + 70) {
          e.vx = (dx / dist) * 260;
          e.vy = (dy / dist) * 260;
        }
      }
      explode(s.ship.x, s.ship.y, "#6ee7ff", 30, 260);
      floatText(s.ship.x, s.ship.y - 24, "Shield broke", "#6ee7ff");
      updateHud();
      return;
    }

    s.lives--;
    s.invincible = 1.8;
    s.shake = 14;
    explode(s.ship.x, s.ship.y, "#4aa8ff", 40, 320);

    if (s.lives <= 0) {
      s.over = true;
      const newBest = s.score > best;
      if (newBest) {
        best = s.score;
        saveBest(best);
      }
      ui.finalScore.textContent = (newBest ? "New best · " : "") + `Score ${s.score} · Level ${levelLabel()}`;
      ui.gameOver.hidden = false;
    }
    updateHud();
  }

  function destroy(enemy) {
    const s = state;
    if (enemy.dead) return;
    enemy.dead = true;

    if (enemy.kind === "node") {
      s.score += 300;
      explode(enemy.x, enemy.y, "#eef3ff", 30, 300);
      const core = enemy.parent;
      const left = s.enemies.filter((e) => e.kind === "node" && e.parent === core && !e.dead).length;
      if (left === 0 && !core.dead) {
        core.shielded = false;
        core.phase = 2;
        core.timer = 2;
        core.timer2 = 3;
        s.shake = 16;
        floatText(core.x, core.y + core.radius + 40, "Shield down", "#eef3ff");
        ui.bossNote.textContent = s.level === Infinity ? "Endless mode" : "Defeat it to continue";
      } else {
        floatText(enemy.x, enemy.y - 20, `${left} left`, "#eef3ff");
      }
      checkProgress();
      updateHud();
      return;
    }

    if (enemy.kind === "boss") {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => running && explode(enemy.x + random(-40, 40), enemy.y + random(-40, 40), i % 2 ? enemy.color : "#eef3ff", 40, 380), i * 120);
      }
      const left = s.enemies.filter((e) => e.kind === "boss" && !e.dead);
      if (left.length) {
        floatText(enemy.x, enemy.y - enemy.radius - 16, "One down", enemy.color);
        for (const twin of left) twin.enraged = true;
      } else {
        bossDefeated(enemy.bossKind, enemy.x, enemy.y);
      }
      checkProgress();
      return;
    }

    const boost = powerBoost();
    if (Math.random() < (HEALTH_DROP[enemy.kind] ?? .015) * boost) dropPowerup(enemy.x - 14, enemy.y, "health");
    if (Math.random() < (SHIELD_DROP[enemy.kind] ?? .003) * boost) dropPowerup(enemy.x + 14, enemy.y, "shield");
    for (const kind of Object.keys(WEAPONS)) {
      if (Math.random() < WEAPONS[kind].drop * boost) dropPowerup(enemy.x, enemy.y + 14, kind);
    }

    if (enemy.kind === "rock") {
      s.score += enemy.radius > 30 ? 20 : 10;
      explode(enemy.x, enemy.y, "#9fb3d6", 18);
      if (enemy.radius > 24) {
        for (let i = 0; i < 2; i++) {
          const angle = random(0, TAU);
          const speed = Math.hypot(enemy.vx, enemy.vy) * 1.3 + 30;
          const piece = makeRock(enemy.x, enemy.y, enemy.radius * .58, Math.cos(angle) * speed, Math.sin(angle) * speed, enemy.shape.map((p) => p * random(.92, 1.08)));
          piece.age = 1;
          s.enemies.push(piece);
        }
      }
    } else {
      s.score += ENEMIES[enemy.kind].points;
      explode(enemy.x, enemy.y, enemy.color, enemy.kind === "tank" ? 40 : 24);
    }

    if (enemy.kind === "splitter") {
      const offset = random(0, TAU);
      for (let i = 0; i < 3; i++) {
        const angle = offset + (i / 3) * TAU;
        const dart = makeEnemy("dart", enemy.x, enemy.y);
        dart.vx = Math.cos(angle) * 240;
        dart.vy = Math.sin(angle) * 240;
        dart.rotation = angle;
        dart.age = 1;
      }
    }

    checkProgress();
    updateHud();
  }


  function updateShip(dt, now) {
    const { ship } = state;
    ship.x += (ship.targetX - ship.x) * (1 - Math.pow(.0005, dt));
    ship.y += (ship.targetY - ship.y) * (1 - Math.pow(.0005, dt));

    let turn = ship.targetAngle - ship.angle;
    turn = Math.atan2(Math.sin(turn), Math.cos(turn));
    ship.angle += turn * (1 - Math.pow(.00002, dt));

    for (const l of state.lasers) {
      if (!l.pincer || l.owner.dead) continue;
      const dx = ship.x - l.owner.x;
      const dy = ship.y - l.owner.y;
      if (dx * Math.cos(l.angle) + dy * Math.sin(l.angle) <= 0) continue;
      const across = -dx * Math.sin(l.angle) + dy * Math.cos(l.angle);
      const wall = l.width / 2 + 10;
      if (across * l.side < wall) {
        const push = l.side * wall - across;
        ship.x += -Math.sin(l.angle) * push;
        ship.y += Math.cos(l.angle) * push;
      }
    }

    const moving = now - state.lastMove < 120;
    if (!moving) state.distanceMoved = 0;
    if (state.distanceMoved > 16 && now - state.lastShot > 85) {
      fire(now);
      state.distanceMoved = 0;
    }

    if (moving && Math.random() < .7) {
      const angle = ship.angle + Math.PI + random(-.4, .4);
      state.particles.push({
        x: ship.x - Math.cos(ship.angle) * 10,
        y: ship.y - Math.sin(ship.angle) * 10,
        vx: Math.cos(angle) * 90, vy: Math.sin(angle) * 90,
        life: .3, maxLife: .3, color: "#7cc4ff", size: 1.6,
      });
    }
  }

  function updateSpawning(dt) {
    const s = state;

    if (s.titleTimer > 0) {
      s.titleTimer -= dt;
      if (s.titleTimer <= 0) {
        if (s.level !== Infinity) s.spawnLevel = s.level;
        s.spawnTimer = 0;
        if (s.bossPending) {
          spawnBoss(s.bossPending);
          s.bossPending = null;
        }
        if (s.level === 1) {
          spawnEnemy();
          spawnEnemy();
        }
        if (s.introduce) {
          spawnEnemy(s.introduce);
          spawnEnemy(s.introduce);
          s.introduce = null;
        }
        if (s.level !== Infinity) {
          s.healthTimer = s.level >= 3 && Math.random() < Math.min(.95, HEALTH_PER_LEVEL * powerBoost()) ? random(4, 15) : Infinity;
        }
      }
      return;
    }

    s.spawnTimer -= dt;
    if (s.spawnTimer <= 0) {
      const progress = s.level === Infinity ? MAX_LEVEL + s.endlessBosses * 2 : s.spawnLevel;
      spawnEnemy();
      if (Math.random() < clamp((progress - 12) * .025, 0, .5)) spawnEnemy();
      const interval = progress <= 20 ? 1.1 - progress * .04 : .3 * Math.pow(.96, progress - 20);
      const bossSlowdown = !s.bossActive ? 1 : s.bossActive === "twins" || s.bossActive === "core" ? 2.5 : 1.8;
      s.spawnTimer = Math.max(.12, interval) * bossSlowdown;
    }

    s.shieldTimer -= dt;
    if (s.shieldTimer <= 0) {
      dropPowerup(random(60, width - 60), random(60, height - 60), "shield");
      s.shieldTimer = random(240, 360) / powerBoost();
    }

    if (s.level >= WEAPONS.starburst.from) {
      s.weaponTimer -= dt;
      if (s.weaponTimer <= 0) {
        dropPowerup(random(60, width - 60), random(60, height - 60), "starburst");
        s.weaponTimer = random(180, 260) / powerBoost();
      }
    }

    s.healthTimer -= dt;
    if (s.healthTimer <= 0) {
      s.healthTimer = s.level === Infinity ? random(80, 140) / powerBoost() : Infinity;
      dropPowerup(random(60, width - 60), random(60, height - 60), "health");
    }
  }


  function steer(e, angle, speed, rate, dt) {
    const k = Math.min(1, dt * rate);
    e.vx += (Math.cos(angle) * speed - e.vx) * k;
    e.vy += (Math.sin(angle) * speed - e.vy) * k;
  }

  function keepDistance(e, toShip, dist, near, far, speed, dt) {
    const approach = dist > far ? 1 : dist < near ? -1 : 0;
    const sideways = toShip + Math.PI / 2;
    const k = Math.min(1, dt * 1.6);
    e.vx += (Math.cos(toShip) * approach * speed + Math.cos(sideways) * speed * .4 - e.vx) * k;
    e.vy += (Math.sin(toShip) * approach * speed + Math.sin(sideways) * speed * .4 - e.vy) * k;
  }

  function hover(e, x, y, ease) {
    e.vx = (x - e.x) * ease;
    e.vy = (y - e.y) * ease;
  }

  function topX(e, sway, speed = .6) {
    return width / 2 + Math.sin(e.age * speed) * width * sway;
  }

  function topY() {
    return Math.min(150, height * .24);
  }

  function updateEnemy(e, dt) {
    const s = state;
    const { ship } = s;
    const lvl = scaledLevel();
    const toShip = Math.atan2(ship.y - e.y, ship.x - e.x);
    const dist = Math.hypot(ship.x - e.x, ship.y - e.y);
    const ready = !s.over && e.age > 1;

    switch (e.kind) {
      case "drone":
        steer(e, toShip, 120 + lvl * 8, 1.6, dt);
        e.rotation = Math.atan2(e.vy, e.vx);
        break;

      case "tank":
        steer(e, toShip, 45 + lvl * 3, .8, dt);
        e.rotation += dt * .5;
        break;

      case "gunner":
        keepDistance(e, toShip, dist, 180, 260, 140, dt);
        e.rotation = toShip;
        e.cooldown -= dt;
        if (ready && e.cooldown <= 0) {
          enemyFire(e, toShip, 240);
          e.cooldown = Math.max(.9, 2 - lvl * .08);
        }
        break;

      case "splitter":
        steer(e, toShip, 90, 1.2, dt);
        e.rotation += dt * 2;
        break;

      case "miner":
        e.rotation += dt * 1.5;
        e.cooldown -= dt;
        if (ready && e.cooldown <= 0 && onScreen(e, -20)) {
          s.hazards.push({ type: "mine", x: e.x, y: e.y, radius: 64, timer: 2.2, max: 2.2, color: e.color });
          e.cooldown = 2.4;
        }
        break;

      case "phantom":
        steer(e, toShip, 110, 1.4, dt);
        e.visible = e.age % 3 < 1.7;
        break;

      case "shielder": {
        steer(e, toShip, 70, 1, dt);
        const turn = angleDiff(toShip, e.rotation);
        e.rotation += clamp(turn, -.7 * dt, .7 * dt);
        break;
      }

      case "sniper":
        keepDistance(e, toShip, dist, 320, 440, 110, dt);
        if (e.state === "idle") {
          e.rotation = toShip;
          e.cooldown -= dt;
          if (ready && e.cooldown <= 0) {
            e.state = "aim";
            e.timer = .9;
            e.aim = toShip;
          }
        } else {
          e.timer -= dt;
          e.rotation = e.aim;
          if (e.timer <= 0) {
            enemyFire(e, e.aim, 650);
            e.state = "idle";
            e.cooldown = 3;
          }
        }
        break;

      case "swarm":
        steer(e, toShip + Math.sin(e.age * 4 + e.phase) * .6, 170, 2.5, dt);
        e.rotation = Math.atan2(e.vy, e.vx);
        break;

      case "orbiter": {
        e.orbit += dt * .9 * e.direction;
        const angle = Math.atan2(ship.y + Math.sin(e.orbit) * 200 - e.y, ship.x + Math.cos(e.orbit) * 200 - e.x);
        steer(e, angle, 230, 2, dt);
        e.rotation += dt * 2;
        e.cooldown -= dt;
        if (ready && e.cooldown <= 0) {
          spread(e, toShip, 3, .15, 230);
          e.cooldown = 2.2;
        }
        break;
      }

      case "bomber":
        if (e.fuse === undefined) {
          steer(e, toShip, 150, 1.4, dt);
          if (dist < 75 && !s.over) e.fuse = .6;
        } else {
          e.vx *= .9;
          e.vy *= .9;
          e.fuse -= dt;
          if (e.fuse <= 0) {
            e.dead = true;
            ring(e, 12, 200, random(0, TAU));
            explode(e.x, e.y, e.color, 30);
          }
        }
        break;

      case "healer":
        keepDistance(e, toShip, dist, 260, 340, 90, dt);
        e.cooldown -= dt;
        if (ready && e.cooldown <= 0) {
          e.cooldown = 2.4;
          s.rings.push({ x: e.x, y: e.y, radius: 0, max: 170, life: .6, color: e.color });
          for (const other of s.enemies) {
            if (other === e || other.dead || other.kind === "boss" || other.hp >= other.maxHp) continue;
            if (Math.hypot(other.x - e.x, other.y - e.y) < 170) {
              other.hp++;
              other.healed = .4;
            }
          }
        }
        break;

      case "blinker":
        e.rotation += dt * 3;
        if (!onScreen(e, -30)) {
          steer(e, Math.atan2(height / 2 - e.y, width / 2 - e.x), 160, 3, dt);
          break;
        }
        if (e.state === "idle") {
          steer(e, toShip, 60, 1, dt);
          e.cooldown -= dt;
          if (ready && e.cooldown <= 0 && onScreen(e, 0)) {
            const angle = random(0, TAU);
            e.destX = clamp(ship.x + Math.cos(angle) * 140, 30, width - 30);
            e.destY = clamp(ship.y + Math.sin(angle) * 140, 30, height - 30);
            e.state = "warp";
            e.timer = .7;
          }
        } else {
          e.vx *= .8;
          e.vy *= .8;
          e.timer -= dt;
          if (e.timer <= 0) {
            explode(e.x, e.y, e.color, 10, 120);
            e.x = e.destX;
            e.y = e.destY;
            const offset = random(0, TAU);
            for (let i = 0; i < 4; i++) enemyFire(e, offset + (i * TAU) / 4, 200);
            e.state = "idle";
            e.cooldown = 2.6;
          }
        }
        break;

      case "node": {
        const core = e.parent;
        e.orbit += dt * .7;
        e.vx = 0;
        e.vy = 0;
        e.x = core.x + Math.cos(e.orbit) * 140;
        e.y = core.y + Math.sin(e.orbit) * 140;
        e.cooldown -= dt;
        if (!s.over && e.cooldown <= 0) {
          enemyFire(e, toShip, 210);
          e.cooldown = 2.4;
        }
        break;
      }
    }

    const holdsDistance = e.kind === "gunner" || e.kind === "sniper" || e.kind === "healer" || e.kind === "miner";
    if (holdsDistance && !onScreen(e, -30)) {
      steer(e, Math.atan2(height / 2 - e.y, width / 2 - e.x), e.kind === "miner" ? 90 : 160, 3, dt);
    }
  }

  function updateBoss(e, dt) {
    const s = state;
    const { ship } = s;
    const toShip = Math.atan2(ship.y - e.y, ship.x - e.x);
    const ready = !s.over && e.age > 2;
    const enraged = e.enraged || e.hp < e.maxHp / 2;
    e.aim = toShip;

    switch (e.bossKind) {
      case "mothership":
        hover(e, topX(e, .3), topY(), 1.2);
        e.cooldown -= dt;
        if (ready && e.cooldown <= 0) {
          spread(e, toShip, enraged ? 7 : 5, .22, 220);
          e.cooldown = enraged ? 1.1 : 1.6;
        }
        break;

      case "hive":
        hover(e, topX(e, .3), topY(), 1.2);
        e.cooldown -= dt;
        if (ready && e.cooldown <= 0) {
          spread(e, toShip, 3, .25, 200);
          e.cooldown = 2;
        }
        e.timer -= dt;
        if (ready && e.timer <= 0) {
          const drones = s.enemies.filter((o) => o.kind === "drone" && !o.dead).length;
          if (drones < 8) {
            for (let i = 0; i < 2; i++) makeEnemy("drone", e.x + random(-30, 30), e.y + random(-20, 30)).age = 1;
          }
          e.timer = enraged ? 2.2 : 3.2;
        }
        break;

      case "spinner":
        hover(e, topX(e, .2), topY(), 1);
        e.timer -= dt;
        if (e.state === "idle") {
          if (e.timer <= 0) {
            e.state = "spin";
            e.timer = 3.5;
          }
        } else {
          e.cooldown -= dt;
          if (ready && e.cooldown <= 0) {
            const arms = enraged ? 3 : 2;
            for (let i = 0; i < arms; i++) enemyFire(e, e.spiral + (i * TAU) / arms, 170);
            e.spiral += .33;
            e.cooldown = .11;
          }
          if (e.timer <= 0) {
            e.state = "idle";
            e.timer = 1.5;
          }
        }
        break;

      case "titan":
        hover(e, topX(e, .25, .4), e.radius + 6, .6);
        e.cooldown -= dt;
        if (ready && e.cooldown <= 0) {
          spread(e, toShip, 3, .18, 230);
          e.cooldown = 2.2;
        }
        e.timer -= dt;
        if (ready && e.timer <= 0 && !hasLaser(e)) {
          addLaser(e, toShip);
          e.timer = enraged ? 3.5 : 5;
        }
        break;

      case "charger":
        if (e.state === "idle") {
          hover(e, topX(e, .3), topY(), 1.4);
          e.cooldown -= dt;
          if (ready && e.cooldown <= 0) {
            spread(e, toShip, 3, .25, 210);
            e.cooldown = 1.2;
          }
          e.timer -= dt;
          if (ready && e.timer <= 0) {
            e.state = "windup";
            e.timer = .4;
            e.targetX = ship.x;
            e.targetY = ship.y;
          }
        } else if (e.state === "windup") {
          e.vx *= .85;
          e.vy *= .85;
          e.aim = Math.atan2(e.targetY - e.y, e.targetX - e.x);
          e.timer -= dt;
          if (e.timer <= 0) {
            e.state = "dash";
            e.timer = .9;
            e.vx = Math.cos(e.aim) * 1150;
            e.vy = Math.sin(e.aim) * 1150;
          }
        } else if (e.state === "dash") {
          e.aim = Math.atan2(e.vy, e.vx);
          e.timer -= dt;
          const arrived = Math.hypot(e.targetX - e.x, e.targetY - e.y) < 30;
          const edge = e.x < e.radius || e.x > width - e.radius || e.y < e.radius || e.y > height - e.radius;
          if (e.timer <= 0 || arrived || edge) {
            e.x = clamp(e.x, e.radius, width - e.radius);
            e.y = clamp(e.y, e.radius, height - e.radius);
            e.vx = 0;
            e.vy = 0;
            e.state = "recover";
            e.timer = .6;
            ring(e, enraged ? 16 : 12, 190, random(0, TAU));
            s.shake = 8;
          }
        } else {
          e.vx = 0;
          e.vy = 0;
          e.timer -= dt;
          if (e.timer <= 0) {
            if (enraged && !e.chained) {
              e.chained = true;
              e.state = "windup";
              e.timer = .35;
              e.targetX = ship.x;
              e.targetY = ship.y;
            } else {
              e.chained = false;
              e.state = "idle";
              e.timer = enraged ? 1.6 : 2.4;
            }
          }
        }
        break;

      case "warden":
        hover(e, topX(e, .25), Math.min(170, height * .28), 1);
        e.rotation += dt * (enraged ? 1.6 : 1.1);
        e.cooldown -= dt;
        if (ready && e.cooldown <= 0) {
          ring(e, 18, 170, random(0, TAU), 3);
          e.cooldown = enraged ? 1.8 : 2.6;
        }
        break;

      case "reaper":
        e.timer -= dt;
        if (e.state === "idle") {
          hover(e, e.homeX, e.homeY, 1.5);
          e.cooldown -= dt;
          if (ready && e.cooldown <= 0) {
            spread(e, toShip, 2, .12, 240);
            e.cooldown = .9;
          }
          if (ready && e.timer <= 0) {
            const reach = e.radius + 75;
            for (let tries = 0; tries < 16; tries++) {
              const angle = random(0, TAU);
              e.destX = clamp(ship.x + Math.cos(angle) * reach, e.radius, width - e.radius);
              e.destY = clamp(ship.y + Math.sin(angle) * reach, e.radius, height - e.radius);
              if (Math.hypot(e.destX - ship.x, e.destY - ship.y) > e.radius + 50) break;
            }
            e.state = "out";
            e.timer = .5;
          }
        } else if (e.state === "out") {
          e.vx = 0;
          e.vy = 0;
          e.fade = Math.max(0, e.timer / .5);
          if (e.timer <= 0) {
            e.x = e.destX;
            e.y = e.destY;
            e.state = "in";
            e.timer = .5;
          }
        } else {
          e.vx = 0;
          e.vy = 0;
          e.fade = Math.min(1, 1 - e.timer / .5);
          if (e.timer <= 0) {
            ring(e, enraged ? 22 : 16, 170, random(0, TAU));
            e.state = "idle";
            e.timer = enraged ? 2.4 : 3.2;
            e.fade = 1;
            e.homeX = random(width * .15, width * .85);
            e.homeY = random(height * .1, height * .3);
          }
        }
        e.untouchable = e.state !== "idle";
        break;

      case "twins": {
        if (s.lasers.some((l) => l.pincer)) {
          e.vx = 0;
          e.vy = 0;
          break;
        }
        e.drift = (e.drift || 0) + dt;
        const x = e.side < 0 ? e.radius + 6 : width - e.radius - 6;
        const y = height * .5 + Math.sin(e.drift * .7 + (e.side > 0 ? Math.PI : 0)) * height * .3;
        hover(e, x, y, 1.2);
        e.cooldown -= dt;
        if (ready && e.cooldown <= 0) {
          spread(e, toShip, 3, .2, 200);
          e.cooldown = e.enraged ? 1.4 : 2.4;
        }
        break;
      }

      case "storm":
        hover(e, topX(e, .3), topY(), 1);
        e.timer -= dt;
        if (ready && e.timer <= 0) {
          strikesAround(ship.x, ship.y, enraged ? 4 : 3, e.color);
          e.timer = enraged ? 1.3 : 1.8;
        }
        e.cooldown -= dt;
        if (ready && e.cooldown <= 0) {
          ring(e, 10, 150, random(0, TAU));
          e.cooldown = 3;
        }
        break;

      case "overseer":
        hover(e, topX(e, .25, .5), e.radius + 6, .8);
        e.timer -= dt;
        if (ready && e.timer <= 0) {
          const move = e.move++ % 3;
          if (move === 0) {
            for (let i = 0; i < 4; i++) {
              const bug = makeEnemy("swarm", e.x + random(-30, 30), e.y + random(-10, 40));
              bug.phase = random(0, TAU);
              bug.age = 1;
            }
          } else if (move === 1) {
            e.waveOffset = random(0, TAU);
            spawnWave(e.x, e.y, 3, e.color, e.waveOffset);
            e.echo = 1.7;
          } else {
            addLaser(e, toShip);
          }
          e.timer = enraged ? 1.8 : 2.5;
        }
        if (e.echo > 0) {
          e.echo -= dt;
          if (e.echo <= 0) spawnWave(e.x, e.y, 3, e.color, e.waveOffset + TAU / 6);
        }
        break;

      case "core": {
        e.rotation += dt * .6;

        if (e.phase === 1) {
          hover(e, topX(e, .18, .3), Math.min(height * .3, 220), .7);
          if (!e.nodesMade) e.shielded = true;
          if (!e.nodesMade && e.age > 1.5) {
            e.nodesMade = true;
            e.shielded = true;
            const nodeHp = Math.max(8, Math.round(e.maxHp * .04));
            e.nodeTotal = nodeHp * 4;
            for (let i = 0; i < 4; i++) {
              s.enemies.push({
                kind: "node", parent: e, orbit: (i * TAU) / 4, x: e.x, y: e.y, vx: 0, vy: 0,
                radius: 15, hp: nodeHp, maxHp: nodeHp, color: "#eef3ff",
                rotation: 0, spin: 2, age: 1, cooldown: 1 + i * .6,
              });
            }
            ui.bossNote.textContent = "Destroy the 4 nodes to break its shield";
          }
          e.timer -= dt;
          if (ready && e.timer <= 0) {
            ring(e, 12, 140, random(0, TAU), 2);
            e.timer = 3.5;
          }
          break;
        }

        hover(e, topX(e, .18, .3), e.radius + 6, .7);
        if (e.phase === 2 && e.hp <= e.maxHp / 2) {
          e.phase = 3;
          e.timer = 2;
          e.timer2 = 1.5;
          e.move = 0;
          s.shake = 16;
          s.enemyShots = [];
          floatText(e.x, e.y + e.radius + 24, "Overload", "#ff4d6d");
        }

        e.cooldown -= dt;
        e.timer -= dt;
        e.timer2 -= dt;

        e.quiet = Math.max(0, (e.quiet || 0) - dt);
        const shipDist = Math.hypot(ship.x - e.x, ship.y - e.y);
        const ringsComing = e.echo > 0 || s.hazards.some((h) => h.type === "strike" || (h.type === "wave" && h.radius < shipDist + 140));
        const laserFree = !hasLaser(e) && e.quiet <= 0;

        if (e.phase === 2) {
          if (ready && e.cooldown <= 0) {
            spread(e, toShip, 5, .2, 210);
            e.cooldown = 1.8;
          }
          if (ready && e.timer <= 0) {
            if (e.move % 2 === 0 && laserFree && !ringsComing) {
              const dir = Math.random() < .5 ? 1 : -1;
              addLaser(e, toShip - dir * .45, false, { sweep: dir * .4, sweepLimit: .8, warn: 1.1, fire: 2.6 });
              e.quiet = 1.1 + 2.6 + .8;
              e.move++;
              e.timer = 1;
            } else if (e.move % 2 === 1 && laserFree) {
              e.waveOffset = random(0, TAU);
              spawnWave(e.x, e.y, 3, "#4aa8ff", e.waveOffset, .8);
              e.echo = 1.7;
              e.move++;
              e.timer = 2.5;
            }
          }
        }

        if (e.phase === 3) {
          e.spinClock = (e.spinClock || 0) + dt;
          if (e.spinClock % 4.5 < 3 && ready && e.cooldown <= 0) {
            for (let i = 0; i < 3; i++) enemyFire(e, e.spiral + (i * TAU) / 3, 160);
            e.spiral += .4;
            e.cooldown = .12;
          }
          if (ready && e.timer <= 0) {
            const step = e.move % 4;
            if ((step === 0 || step === 2) && laserFree && !ringsComing) {
              const dir = Math.random() < .5 ? 1 : -1;
              addLaser(e, toShip - dir * .5, false, { sweep: dir * .5, sweepLimit: .95, warn: 1.1, fire: 2.4 });
              e.quiet = 1.1 + 2.4 + .8;
              e.move++;
              e.timer = 1;
            } else if (step === 1 && laserFree) {
              e.waveOffset = random(0, TAU);
              spawnWave(e.x, e.y, 4, "#ff4d6d", e.waveOffset, .75);
              e.move++;
              e.timer = 2;
            } else if (step === 3 && laserFree) {
              strikesAround(ship.x, ship.y, 3, "#ff4d6d");
              e.move++;
              e.timer = 2;
            }
          }
        }

        if (e.echo > 0) {
          e.echo -= dt;
          if (e.echo <= 0) spawnWave(e.x, e.y, 3, e.phase === 3 ? "#ff4d6d" : "#4aa8ff", e.waveOffset + TAU / 6, .8);
        }
        break;
      }
    }
  }

  function updateTwinLasers(dt) {
    const s = state;
    if (s.bossActive !== "twins") return;
    const twins = s.enemies.filter((e) => e.kind === "boss" && e.bossKind === "twins" && !e.dead);
    s.twinClock -= dt;
    s.pincerCooldown -= dt;
    if (s.twinClock > 0 || s.over || !twins.length) return;
    if (twins.some((t) => hasLaser(t))) return;

    if (twins.length === 2 && twins.every((t) => t.age > 2) && s.twinShots >= 3) {
      s.twinShots = 0;
      for (const twin of twins) {
        const toShip = Math.atan2(s.ship.y - twin.y, s.ship.x - twin.x);
        const targetX = s.ship.x - Math.sin(toShip) * 115;
        const targetY = s.ship.y + Math.cos(toShip) * 115;
        const angle = Math.atan2(targetY - twin.y, targetX - twin.x);
        const across = -(s.ship.x - twin.x) * Math.sin(angle) + (s.ship.y - twin.y) * Math.cos(angle);
        addLaser(twin, angle, true, { side: Math.sign(across) || 1 });
      }
      for (const shot of s.enemyShots) {
        if ((shot.x - s.ship.x) ** 2 + (shot.y - s.ship.y) ** 2 < 180 ** 2) shot.life = 0;
      }
      floatText(s.ship.x, s.ship.y - 30, "Hold still", "#ff4d6d");
      s.pincerCooldown = 10;
      s.twinClock = 3.4;
      return;
    }

    const shooter = twins.find((t) => t.side === s.twinTurn) || twins[0];
    if (shooter.age > 2) {
      addLaser(shooter, Math.atan2(s.ship.y - shooter.y, s.ship.x - shooter.x));
      s.twinTurn *= -1;
      s.twinShots++;
    }
    s.twinClock = twins.length > 1 ? 2.4 : 1.8;
  }

  function updateEnemies(dt) {
    for (const e of state.enemies) {
      e.age += dt;
      e.rotation += (e.spin || 0) * dt;
      if (e.healed) e.healed = Math.max(0, e.healed - dt);

      if (e.kind === "boss") updateBoss(e, dt);
      else updateEnemy(e, dt);

      e.x += e.vx * dt;
      e.y += e.vy * dt;

      if (e.kind === "dart" && Math.random() < .6) {
        state.particles.push({ x: e.x, y: e.y, vx: 0, vy: 0, life: .25, maxLife: .25, color: "#ffd34d", size: 2 });
      }
    }
    updateTwinLasers(dt);
  }

  function updateHazards(dt) {
    const s = state;
    const canBeHit = !s.over && s.invincible <= 0;

    for (const h of s.hazards) {
      if (h.type === "wave") {
        h.radius += h.speed * dt;
        if (h.radius > Math.hypot(width, height)) h.done = true;
        const dist = Math.hypot(s.ship.x - h.x, s.ship.y - h.y);
        if (canBeHit && Math.abs(dist - h.radius) < h.width / 2 + 7) {
          const angle = Math.atan2(s.ship.y - h.y, s.ship.x - h.x);
          const margin = 10 / Math.max(h.radius, 1);
          const safe = h.gaps.some((g) => Math.abs(angleDiff(angle, g)) < h.gapSize / 2 - margin);
          if (!safe) hitShip();
        }
        continue;
      }
      h.timer -= dt;
      if (h.timer > 0) continue;
      h.done = true;
      explode(h.x, h.y, h.color, 26, 220);
      s.rings.push({ x: h.x, y: h.y, radius: h.radius * .4, max: h.radius * 1.3, life: .35, color: h.color });
      if (canBeHit && Math.hypot(s.ship.x - h.x, s.ship.y - h.y) < h.radius + 6) hitShip();
    }
    s.hazards = s.hazards.filter((h) => !h.done);

    for (const l of s.lasers) {
      if (l.owner.dead) {
        l.done = true;
        continue;
      }
      if (l.warn > 0) {
        l.warn -= dt;
        continue;
      }
      l.fire -= dt;
      if (l.fire <= 0) l.done = true;
      if (l.sweep && Math.abs(l.swept || 0) < l.sweepLimit) {
        const step = l.sweep * dt;
        l.angle += step;
        l.swept = (l.swept || 0) + step;
      }

      if (!s.over && s.invincible <= 0) {
        const dx = s.ship.x - l.owner.x;
        const dy = s.ship.y - l.owner.y;
        const along = dx * Math.cos(l.angle) + dy * Math.sin(l.angle);
        const across = Math.abs(-dx * Math.sin(l.angle) + dy * Math.cos(l.angle));
        if (along > 0 && across < l.width / 2 + 8) hitShip();
      }
    }
    s.lasers = s.lasers.filter((l) => !l.done);

    for (const r of s.rings) {
      r.life -= dt;
      r.radius += (r.max - r.radius) * Math.min(1, dt * 8);
    }
    s.rings = s.rings.filter((r) => r.life > 0);
  }

  function bulletBlocked(e, b) {
    if (e.kind === "phantom" && !e.visible) return "pass";
    if (e.untouchable) return "pass";

    const dist = Math.hypot(b.x - e.x, b.y - e.y);
    const angle = Math.atan2(b.y - e.y, b.x - e.x);

    if (e.shielded) return "block";

    if (e.kind === "shielder" && Math.abs(angleDiff(angle, e.rotation)) < 1.4) return "block";

    if (e.bossKind === "warden" && dist < e.radius + 34 && dist > e.radius + 8) {
      for (let i = 0; i < 3; i++) {
        if (Math.abs(angleDiff(angle, e.rotation + (i * TAU) / 3)) < .55) return "block";
      }
    }
    return null;
  }

  function checkCollisions() {
    const s = state;
    const { ship } = s;
    const canBeHit = () => !s.over && s.invincible <= 0;

    for (const e of s.enemies) {
      for (const b of s.bullets) {
        if (e.dead || b.life <= 0) continue;
        const reach = e.bossKind === "warden" ? e.radius + 34 : e.shielded ? e.radius + 22 : e.kind === "shielder" ? e.radius + 12 : e.radius + 3;
        if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 > reach ** 2) continue;

        const blocked = bulletBlocked(e, b);
        if (blocked === "pass") continue;
        if (blocked === "block") {
          b.life = 0;
          explode(b.x, b.y, "#eef3ff", 4, 120);
          continue;
        }
        if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 > (e.radius + 3) ** 2) continue;

        b.life = 0;
        e.hp--;
        e.flash = .08;
        explode(b.x, b.y, e.kind === "rock" ? "#9fb3d6" : e.kind === "boss" ? "#eef3ff" : e.color, 5, 140);
        if (e.hp <= 0) destroy(e);
      }

      const solid = !(e.kind === "phantom" && !e.visible) && !e.untouchable;
      if (!e.dead && solid && canBeHit() && (ship.x - e.x) ** 2 + (ship.y - e.y) ** 2 < (e.radius + 9) ** 2) {
        if (e.kind === "node") {
          destroy(e);
        } else if (e.kind !== "boss") {
          e.dead = true;
          explode(e.x, e.y, e.color || "#9fb3d6", 16);
        }
        hitShip();
      }
    }

    for (const shot of s.enemyShots) {
      if (!shot.breakable || shot.life <= 0) continue;
      for (const b of s.bullets) {
        if (b.life > 0 && (b.x - shot.x) ** 2 + (b.y - shot.y) ** 2 < 11 ** 2) {
          b.life = 0;
          shot.life = 0;
          explode(shot.x, shot.y, shot.color, 6, 110);
          break;
        }
      }
    }

    for (const shot of s.enemyShots) {
      if (shot.life > 0 && canBeHit() && (ship.x - shot.x) ** 2 + (ship.y - shot.y) ** 2 < 100) {
        shot.life = 0;
        hitShip();
      }
    }

    for (const p of s.powerups) {
      if (!s.over && (ship.x - p.x) ** 2 + (ship.y - p.y) ** 2 < 26 ** 2) {
        p.collected = true;
        collectPowerup(p);
      }
    }
  }

  function onScreen(obj, margin) {
    return obj.x > -margin && obj.x < width + margin && obj.y > -margin && obj.y < height + margin;
  }

  function updateBossBar(dt) {
    const s = state;
    if (!s.bossActive) return;

    const core = s.bossActive === "core" && s.enemies.find((e) => e.bossKind === "core" && !e.dead);
    if (core) {
      const stage = core.phase;
      if (stage !== s.coreStage) {
        const first = !s.coreStage;
        s.coreStage = stage;
        ui.bossName.textContent = `The Core \u00b7 ${["Shield", "Exposed", "Overload"][stage - 1]} (${stage}/3)`;
        ui.bossHealth.style.background = ["#eef3ff", "#4aa8ff", "#ff4d6d"][stage - 1];
        if (!first) {
          ui.bossBar.hidden = true;
          s.barHiddenFor = 1.2;
        }
      }
      if (s.barHiddenFor > 0) {
        s.barHiddenFor -= dt;
        if (s.barHiddenFor <= 0) ui.bossBar.hidden = false;
      }

      let fraction = 1;
      if (stage === 1 && core.nodesMade) {
        const nodes = s.enemies.filter((e) => e.kind === "node" && e.parent === core && !e.dead);
        fraction = nodes.reduce((sum, n) => sum + Math.max(0, n.hp), 0) / core.nodeTotal;
      } else if (stage === 2) {
        fraction = (core.hp - core.maxHp / 2) / (core.maxHp / 2);
      } else if (stage === 3) {
        fraction = core.hp / (core.maxHp / 2);
      }
      ui.bossHealth.style.width = clamp(fraction, 0, 1) * 100 + "%";
      return;
    }

    const parts = s.enemies.filter((e) => e.kind === "boss");
    const hp = parts.reduce((sum, e) => sum + Math.max(0, e.dead ? 0 : e.hp), 0);
    const max = parts.reduce((sum, e) => sum + e.maxHp, 0) || 1;
    ui.bossHealth.style.width = (hp / max) * 100 + "%";
  }

  function loop(now) {
    const s = state;
    const rotate = needsLandscape();
    ui.rotate.hidden = !rotate;
    if (rotate) {
      lastTime = now;
      frameId = requestAnimationFrame(loop);
      return;
    }
    const dt = Math.min(.05, (now - lastTime) / 1000);
    lastTime = now;

    if (!s.over) {
      updateShip(dt, now);
      updateSpawning(dt);
      s.invincible = Math.max(0, s.invincible - dt);
    }

    for (const list of [s.bullets, s.enemyShots]) {
      for (const b of list) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
      }
    }

    updateEnemies(dt);
    updateHazards(dt);

    for (const p of s.powerups) {
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= .99;
      p.vy *= .99;
      if (p.x < 20 || p.x > width - 20) p.vx *= -1;
      if (p.y < 20 || p.y > height - 20) p.vy *= -1;
    }

    checkCollisions();
    updateBossBar(dt);

    for (const e of s.enemies) {
      if (e.flash) e.flash = Math.max(0, e.flash - dt);
    }
    for (const p of s.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= .96;
      p.vy *= .96;
      p.life -= dt;
    }
    for (const t of s.texts) {
      t.y -= 30 * dt;
      t.life -= dt;
    }

    s.bullets = s.bullets.filter((b) => b.life > 0 && onScreen(b, 20));
    s.enemyShots = s.enemyShots.filter((b) => b.life > 0 && onScreen(b, 30));
    s.enemies = s.enemies.filter((e) => !e.dead && (e.kind === "boss" || e.kind === "node" || e.age < 3 || onScreen(e, 150)));
    s.powerups = s.powerups.filter((p) => !p.collected && p.age < p.lifetime);
    s.particles = s.particles.filter((p) => p.life > 0);
    s.texts = s.texts.filter((t) => t.life > 0);
    s.shake = Math.max(0, s.shake - dt * 40);

    if (s.weapon && !s.over) {
      const before = Math.ceil(s.weapon.time);
      s.weapon.time = Math.max(0, s.weapon.time - dt);
      if (s.weapon.time === 0) {
        floatText(s.ship.x, s.ship.y - 24, `${WEAPONS[s.weapon.kind].name} over`, POWER_COLORS[s.weapon.kind]);
        s.weapon = null;
        updateHud();
      } else if (Math.ceil(s.weapon.time) !== before) {
        updateHud();
      }
    }

    draw(now);
    frameId = requestAnimationFrame(loop);
  }


  function polygon(sides, radius, rotation = 0) {
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const a = rotation + (i / sides) * TAU;
      ctx.lineTo(Math.cos(a) * radius, Math.sin(a) * radius);
    }
    ctx.closePath();
  }

  function circle(x, y, radius) {
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, TAU);
  }

  function shape(points) {
    ctx.beginPath();
    for (const [x, y] of points) ctx.lineTo(x, y);
    ctx.closePath();
  }

  function drawHealthBar(e) {
    if (e.kind === "boss" || e.maxHp <= 1 || e.hp >= e.maxHp) return;
    const w = e.radius * 1.6;
    const x = e.x - w / 2, y = e.y - e.radius - 10;
    ctx.fillStyle = "#1a2436";
    ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = e.kind === "rock" ? "#a9bbdc" : e.color;
    ctx.fillRect(x, y, w * e.hp / e.maxHp, 3);
  }

  function outline(color, lineWidth, fill) {
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  function drawEnemy(e, now) {
    const hit = e.flash > 0;
    const c = e.color;
    const dark = hit ? "#2a3a5c" : "#0d1526";

    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.healed) {
      ctx.strokeStyle = "#3ddc84";
      ctx.globalAlpha = e.healed * 2;
      circle(0, 0, e.radius + 6);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.rotate(e.rotation);

    switch (e.kind) {
      case "rock":
        ctx.beginPath();
        e.shape.forEach((r, i) => {
          const a = (i / e.shape.length) * TAU;
          ctx.lineTo(Math.cos(a) * e.radius * r, Math.sin(a) * e.radius * r);
        });
        ctx.closePath();
        outline(e.hp > 1 ? "#a9bbdc" : "#6f82a6", 1.5, dark);
        break;

      case "drone":
        shape([[14, 0], [0, 9], [-10, 0], [0, -9]]);
        outline(c, 1.6, "#2a0b14");
        ctx.fillStyle = c;
        circle(2, 0, 2.2 + Math.sin(now / 90) * .8);
        ctx.fill();
        break;

      case "dart":
        shape([[14, 0], [-8, -6], [-4, 0], [-8, 6]]);
        ctx.fillStyle = c;
        ctx.fill();
        break;

      case "tank":
        polygon(6, e.radius);
        outline(c, 2, hit ? "#4a2a10" : "#1f1408");
        polygon(6, e.radius * .55, Math.PI / 6);
        ctx.strokeStyle = "rgba(255, 154, 61, .6)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = c;
        circle(0, 0, 3);
        ctx.fill();
        break;

      case "gunner":
        circle(0, 0, e.radius);
        outline(c, 1.8, hit ? "#3a2060" : "#170d26");
        ctx.fillStyle = c;
        ctx.fillRect(e.radius - 4, -3, 12, 6);
        circle(0, 0, 5);
        ctx.fill();
        break;

      case "splitter":
        polygon(3, e.radius);
        outline(c, 1.8, dark);
        ctx.fillStyle = c;
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * TAU;
          circle(Math.cos(a) * 6, Math.sin(a) * 6, 2);
          ctx.fill();
        }
        break;

      case "miner":
        polygon(4, e.radius, Math.PI / 4);
        outline(c, 1.8, dark);
        ctx.strokeStyle = c;
        ctx.beginPath();
        ctx.moveTo(-6, 0);
        ctx.lineTo(6, 0);
        ctx.moveTo(0, -6);
        ctx.lineTo(0, 6);
        ctx.stroke();
        break;

      case "phantom":
        ctx.globalAlpha = e.visible ? 1 : .12;
        circle(0, 0, e.radius);
        outline(c, 1.6, dark);
        ctx.fillStyle = c;
        circle(-4, -2, 2);
        ctx.fill();
        circle(4, -2, 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        break;

      case "shielder":
        circle(0, 0, e.radius * .7);
        outline(c, 1.6, dark);
        ctx.strokeStyle = c;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(0, 0, e.radius + 6, -1.35, 1.35);
        ctx.stroke();
        break;

      case "sniper":
        shape([[18, 0], [0, 6], [-10, 0], [0, -6]]);
        outline(c, 1.6, dark);
        if (e.state === "aim") {
          ctx.strokeStyle = c;
          ctx.globalAlpha = .25 + .5 * (1 - e.timer / .9);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(18, 0);
          ctx.lineTo(3000, 0);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        break;

      case "swarm":
        shape([[8, 0], [-5, -4], [-5, 4]]);
        ctx.fillStyle = c;
        ctx.fill();
        break;

      case "orbiter":
        circle(0, 0, e.radius * .7);
        outline(c, 1.6, dark);
        ctx.fillStyle = c;
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * TAU;
          circle(Math.cos(a) * e.radius, Math.sin(a) * e.radius, 2.5);
          ctx.fill();
        }
        break;

      case "bomber": {
        const flashing = e.fuse !== undefined && Math.floor(now / 70) % 2;
        circle(0, 0, e.radius);
        outline(c, 1.8, flashing ? c : dark);
        ctx.fillStyle = flashing ? "#fff" : c;
        circle(0, 0, 4);
        ctx.fill();
        break;
      }

      case "healer":
        ctx.rotate(e.age * 1.5);
        circle(0, 0, e.radius * .6);
        outline(c, 1.8, dark);
        polygon(3, e.radius * .32, -Math.PI / 2);
        ctx.fillStyle = c;
        ctx.fill();
        for (let i = 0; i < 3; i++) {
          const a = (i * TAU) / 3;
          circle(Math.cos(a) * e.radius, Math.sin(a) * e.radius, 3);
          ctx.fill();
        }
        ctx.strokeStyle = c;
        ctx.globalAlpha = .35 + .25 * Math.sin(now / 160);
        ctx.lineWidth = 1;
        circle(0, 0, e.radius);
        ctx.stroke();
        ctx.globalAlpha = 1;
        break;

      case "node":
        ctx.rotate(-e.rotation);
        ctx.strokeStyle = "rgba(238, 243, 255, .25)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(e.parent.x - e.x, e.parent.y - e.y);
        ctx.stroke();
        ctx.rotate(e.rotation);
        polygon(4, e.radius, 0);
        outline("#eef3ff", 2, dark);
        polygon(4, e.radius * .45, Math.PI / 4);
        ctx.fillStyle = "#4aa8ff";
        ctx.fill();
        break;

      case "blinker":
        polygon(4, e.radius, 0);
        outline(c, 1.8, dark);
        polygon(4, e.radius * .45, 0);
        ctx.fillStyle = c;
        ctx.fill();
        break;
    }

    ctx.restore();

    if (e.kind === "blinker" && e.state === "warp") {
      ctx.strokeStyle = e.color;
      ctx.globalAlpha = .4 + .4 * Math.sin(now / 60);
      ctx.setLineDash([4, 4]);
      circle(e.destX, e.destY, e.radius + 6);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    drawHealthBar(e);
  }

  function drawBoss(e, now) {
    const r = e.radius;
    const c = e.color;
    const hit = e.flash > 0;
    const enraged = e.enraged || e.hp < e.maxHp / 2;

    if (e.bossKind === "reaper" && e.state === "out") {
      ctx.strokeStyle = c;
      ctx.lineWidth = 2;
      ctx.globalAlpha = .4 + .4 * Math.sin(now / 50);
      ctx.setLineDash([8, 6]);
      circle(e.destX, e.destY, r);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.globalAlpha = e.fade ?? 1;

    if (e.bossKind === "warden") {
      ctx.strokeStyle = c;
      ctx.lineWidth = 8;
      ctx.lineCap = "round";
      for (let i = 0; i < 3; i++) {
        const a = e.rotation + (i * TAU) / 3;
        ctx.beginPath();
        ctx.arc(0, 0, r + 22, a - .55, a + .55);
        ctx.stroke();
      }
    }

    if (e.bossKind === "titan" || e.bossKind === "overseer") {
      const laser = state.lasers.find((l) => l.owner === e);
      const aim = laser ? laser.angle : e.aim;
      ctx.save();
      ctx.rotate(aim);
      ctx.fillStyle = c;
      ctx.fillRect(r * .4, -6, r * .85, 12);
      ctx.restore();
    }

    if (e.bossKind === "charger") {
      ctx.save();
      ctx.rotate(e.aim || 0);
      ctx.fillStyle = c;
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - .2) * r, Math.sin(a - .2) * r);
        ctx.lineTo(Math.cos(a) * (r + 16), Math.sin(a) * (r + 16));
        ctx.lineTo(Math.cos(a + .2) * r, Math.sin(a + .2) * r);
        ctx.fill();
      }
      ctx.restore();
    }

    if (e.bossKind === "spinner") {
      ctx.save();
      ctx.rotate(e.spiral);
      ctx.fillStyle = c;
      for (let i = 0; i < 3; i++) {
        ctx.rotate(TAU / 3);
        shape([[r * .6, -8], [r * 1.4, 0], [r * .6, 8]]);
        ctx.fill();
      }
      ctx.restore();
    }

    if (e.bossKind === "hive") {
      ctx.strokeStyle = c;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU + e.age * .3;
        ctx.save();
        ctx.translate(Math.cos(a) * (r + 10), Math.sin(a) * (r + 10));
        polygon(6, 7);
        ctx.fillStyle = "#2a0b14";
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    if (e.bossKind === "storm") {
      ctx.strokeStyle = c;
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * TAU + e.age * .5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        ctx.lineTo(Math.cos(a + .12) * (r + 10), Math.sin(a + .12) * (r + 10));
        ctx.lineTo(Math.cos(a - .05) * (r + 18), Math.sin(a - .05) * (r + 18));
        ctx.lineTo(Math.cos(a + .08) * (r + 28), Math.sin(a + .08) * (r + 28));
        ctx.stroke();
      }
    }

    if (e.bossKind === "reaper") {
      ctx.strokeStyle = c;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, r + 12, Math.PI * .9 + e.age, Math.PI * 1.6 + e.age);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, r + 12, Math.PI * -.1 + e.age, Math.PI * .6 + e.age);
      ctx.stroke();
    }

    polygon(e.sides, r, Math.PI / e.sides);
    ctx.fillStyle = hit ? "#1c3358" : "#0a1428";
    ctx.fill();
    ctx.strokeStyle = c;
    ctx.lineWidth = e.bossKind === "titan" || e.bossKind === "core" ? 3.5 : 2.5;
    ctx.stroke();
    if (e.bossKind === "titan") {
      polygon(e.sides, r - 8, Math.PI / e.sides);
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.save();
    ctx.rotate(e.age * 1.2);
    polygon(e.sides, r * .66);
    ctx.globalAlpha = (e.fade ?? 1) * .55;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.globalAlpha = e.fade ?? 1;
    if (e.bossKind === "mothership" || e.bossKind === "twins") {
      ctx.fillStyle = c;
      for (let i = 0; i < 4; i++) {
        ctx.rotate(TAU / 4);
        ctx.fillRect(r * .66 - 3, -3, 6, 6);
      }
    }
    ctx.restore();

    if (e.bossKind === "core" && e.shielded) {
      ctx.save();
      ctx.globalAlpha = .1 + .05 * Math.sin(now / 200);
      ctx.fillStyle = "#eef3ff";
      circle(0, 0, r + 22);
      ctx.fill();
      ctx.globalAlpha = .55 + .2 * Math.sin(now / 200);
      ctx.strokeStyle = "#eef3ff";
      ctx.lineWidth = 2;
      circle(0, 0, r + 22);
      ctx.stroke();
      ctx.restore();
    }

    if (e.bossKind === "core") {
      for (let i = 1; i <= 2; i++) {
        ctx.save();
        ctx.rotate(e.age * (i % 2 ? -.8 : .5));
        polygon(e.sides, r * (.66 - i * .15));
        ctx.strokeStyle = ["#eef3ff", "#4aa8ff", "#ff4d6d"][e.phase - 1];
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }
    }

    if (e.bossKind === "overseer") {
      ctx.fillStyle = "#eef3ff";
      ctx.beginPath();
      ctx.ellipse(0, 0, r * .5, r * .3, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = c;
      circle(Math.cos(e.aim) * r * .22, Math.sin(e.aim) * r * .12, r * .16);
      ctx.fill();
    } else {
      const coreColor = e.bossKind === "core" ? ["#eef3ff", "#4aa8ff", "#ff4d6d"][e.phase - 1] : enraged ? "#ff4d6d" : "#eef3ff";
      ctx.fillStyle = coreColor;
      circle(0, 0, (e.bossKind === "core" ? 14 : 9) + Math.sin(now / 120) * 2);
      ctx.fill();
    }

    if (e.bossKind === "charger" && e.state === "windup") {
      ctx.strokeStyle = "#ff9a3d";
      ctx.globalAlpha = .5;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(e.targetX - e.x, e.targetY - e.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();
  }

  function drawPowerup(p, now) {
    const color = POWER_COLORS[p.kind];
    const blinking = p.lifetime - p.age < 2 && Math.floor(now / 120) % 2;
    const alpha = blinking ? .3 : 1;

    ctx.save();
    ctx.translate(p.x, p.y + Math.sin(p.age * 4) * 2);

    ctx.fillStyle = color;
    ctx.globalAlpha = alpha * (.15 + .1 * Math.sin(p.age * 6));
    circle(0, 0, 18);
    ctx.fill();

    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    circle(0, 0, 12);
    ctx.stroke();

    if (p.kind === "health") {
      ctx.fillRect(-1.5, -6, 3, 12);
      ctx.fillRect(-6, -1.5, 12, 3);
    } else if (p.kind === "starburst") {
      ctx.lineCap = "round";
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 12; i++) {
        const a = (i * TAU) / 12;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 3, Math.sin(a) * 3);
        ctx.lineTo(Math.cos(a) * 8, Math.sin(a) * 8);
        ctx.stroke();
      }
    } else {
      shape([[0, -7], [6, -4], [5, 3], [0, 7], [-5, 3], [-6, -4]]);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawWave(h) {
    const gaps = [...h.gaps].map((g) => ((g % TAU) + TAU) % TAU).sort((a, b) => a - b);
    for (const pass of [[h.width + 12, .22], [h.width, .9]]) {
      ctx.strokeStyle = h.color;
      ctx.lineWidth = pass[0];
      ctx.globalAlpha = pass[1];
      for (let i = 0; i < gaps.length; i++) {
        const start = gaps[i] + h.gapSize / 2;
        const end = (i + 1 < gaps.length ? gaps[i + 1] : gaps[0] + TAU) - h.gapSize / 2;
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.radius, start, end);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawHazards(now) {
    for (const h of state.hazards) {
      if (h.type === "wave") {
        drawWave(h);
        continue;
      }
      const progress = 1 - h.timer / h.max;
      ctx.strokeStyle = h.color;
      ctx.fillStyle = h.color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = .5 + .4 * Math.sin(now / (h.timer < .4 ? 40 : 110));
      circle(h.x, h.y, h.radius);
      ctx.stroke();
      ctx.globalAlpha = .12 + progress * .25;
      circle(h.x, h.y, h.radius * progress);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (h.type === "mine") {
        circle(h.x, h.y, 4);
        ctx.fill();
      }
    }

    for (const r of state.rings) {
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = Math.max(0, r.life * 1.6);
      ctx.lineWidth = 2;
      circle(r.x, r.y, r.radius);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawLasers(now) {
    for (const l of state.lasers) {
      const x = l.owner.x, y = l.owner.y;
      const ex = x + Math.cos(l.angle) * 4000, ey = y + Math.sin(l.angle) * 4000;
      const color = l.owner.color;

      if (l.warn > 0) {
        ctx.strokeStyle = color;
        ctx.globalAlpha = l.pincer ? .22 : .1;
        ctx.lineWidth = l.width;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        if (l.pincer) {
          ctx.globalAlpha = .8;
          ctx.lineWidth = 2;
          for (const edge of [-1, 1]) {
            const ox = -Math.sin(l.angle) * (l.width / 2) * edge;
            const oy = Math.cos(l.angle) * (l.width / 2) * edge;
            ctx.beginPath();
            ctx.moveTo(x + ox, y + oy);
            ctx.lineTo(ex + ox, ey + oy);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = .25 + .35 * (Math.floor(now / 80) % 2);
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 8]);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(ex, ey);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        continue;
      }

      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      ctx.strokeStyle = color;
      ctx.globalAlpha = .45;
      ctx.lineWidth = l.width + 18;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.lineWidth = l.width * .35;
      ctx.strokeStyle = "#fff";
      ctx.stroke();
      ctx.globalCompositeOperation = "source-over";
    }
  }

  const SHIP_OUTLINE = (() => {
    const corners = [[15, 0], [-9, -10], [-5, 0], [-9, 10]];
    const points = [];
    for (let i = 0; i < corners.length; i++) {
      const [ax, ay] = corners[i];
      const [bx, by] = corners[(i + 1) % corners.length];
      for (let step = 0; step < 8; step++) {
        const t = step / 8;
        points.push([ax + (bx - ax) * t, ay + (by - ay) * t]);
      }
    }
    return points;
  })();

  function ballAmount() {
    const w = state.weapon;
    if (!w || w.kind !== "starburst") return 0;
    const elapsed = WEAPONS.starburst.time - w.time;
    return Math.min(1, elapsed / .3, w.time / .3);
  }

  function drawShip(now) {
    const { ship } = state;
    const blinking = state.invincible > 0 && Math.floor(now / 90) % 2;
    const ball = ballAmount();

    if (!blinking) {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      const spun = state.weapon ? (WEAPONS.starburst.time - state.weapon.time) * 7 : 0;
      ctx.rotate(ship.angle + ball * spun);

      if (now - state.lastMove < 120 && ball < .5) {
        ctx.fillStyle = "#4aa8ff";
        ctx.globalAlpha = 1 - ball * 2;
        shape([[-8, -4], [-15 - Math.random() * 8, 0], [-8, 4]]);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      if (ball > 0) {
        ctx.fillStyle = "#ff6ec7";
        ctx.globalAlpha = ball * (.25 + .1 * Math.sin(now / 80));
        circle(0, 0, 20);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      shape(SHIP_OUTLINE.map(([x, y]) => {
        const a = Math.atan2(y, x);
        return [x + (Math.cos(a) * 11 - x) * ball, y + (Math.sin(a) * 11 - y) * ball];
      }));
      ctx.fillStyle = "#eef3ff";
      ctx.fill();
      ctx.strokeStyle = ball > .5 ? "#ff6ec7" : "#4aa8ff";
      ctx.lineWidth = 1.5 + ball;
      ctx.stroke();

      if (ball > .6) {
        ctx.strokeStyle = "#ff6ec7";
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = (ball - .6) / .4;
        for (let i = 0; i < 12; i++) {
          const a = (i * TAU) / 12;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 4, Math.sin(a) * 4);
          ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    if (ship.shield) {
      ctx.strokeStyle = "#6ee7ff";
      ctx.lineWidth = 2;
      ctx.globalAlpha = .55 + .25 * Math.sin(now / 150);
      circle(ship.x, ship.y, 22);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function draw(now) {
    const s = state;
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    if (s.shake) ctx.translate(random(-s.shake, s.shake), random(-s.shake, s.shake));

    drawHazards(now);

    ctx.globalCompositeOperation = "lighter";
    for (const p of s.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    ctx.lineCap = "round";
    for (const b of s.bullets) {
      const tailX = b.x - b.vx * .018, tailY = b.y - b.vy * .018;
      ctx.strokeStyle = "rgba(74, 168, 255, .35)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();
      ctx.strokeStyle = "#e6f3ff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    for (const shot of s.enemyShots) {
      if (shot.breakable) {
        ctx.fillStyle = shot.color;
        ctx.globalAlpha = .18;
        circle(shot.x, shot.y, 6);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = shot.color;
        ctx.lineWidth = 2;
        circle(shot.x, shot.y, 6);
        ctx.stroke();
        continue;
      }
      ctx.fillStyle = shot.color;
      ctx.globalAlpha = .3;
      circle(shot.x, shot.y, 8);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff";
      circle(shot.x, shot.y, 3);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    drawLasers(now);
    for (const e of s.enemies) {
      if (e.kind === "boss") drawBoss(e, now);
      else drawEnemy(e, now);
    }
    for (const p of s.powerups) drawPowerup(p, now);
    if (!s.over) drawShip(now);

    ctx.font = "500 11px 'Martian Mono', ui-monospace, monospace";
    ctx.textAlign = "center";
    for (const t of s.texts) {
      ctx.globalAlpha = Math.min(1, t.life * 2);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text.toUpperCase(), t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }


  function isOverContent(x, y) {
    const title = document.getElementById("name").getBoundingClientRect();
    const list = document.getElementById("accounts").getBoundingClientRect();
    const more = document.getElementById("more");
    const bottom = more ? more.getBoundingClientRect().bottom : list.bottom;
    const pad = 12;
    return x >= Math.min(title.left, list.left) - pad
      && x <= Math.max(title.right, list.right) + pad
      && y >= title.top - pad
      && y <= bottom + pad;
  }

  addEventListener("resize", () => running && resize());

  addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse" && usingTouch() && (Math.abs(e.movementX) + Math.abs(e.movementY)) > 2) setInputMode("mouse");
    if (!running || state.over) return;
    const { ship } = state;
    const x = (e.pointerType === "touch" ? fingerX(e.clientX) : e.clientX) / view;
    const y = (e.clientY - (e.pointerType === "touch" ? fingerOffset(e.clientY) : 0)) / view;
    const dx = x - ship.targetX;
    const dy = y - ship.targetY;
    const dist = Math.hypot(dx, dy);

    ship.targetX = x;
    ship.targetY = y;
    if (dist > .5) {
      state.distanceMoved += dist;
      state.lastMove = performance.now();
      if (dist > 2) ship.targetAngle = Math.atan2(dy, dx);
    }
  });

  addEventListener("pointerdown", (e) => {
    if (e.pointerType !== lastPointer) setInputMode(e.pointerType);
    if (e.pointerType !== "touch") return;
    if (running && !state.over) {
      state.ship.targetX = fingerX(e.clientX) / view;
      state.ship.targetY = (e.clientY - fingerOffset(e.clientY)) / view;
    }
  });

  $("play").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!running) start(innerWidth / 2, innerHeight * .6);
  });

  ui.quit.addEventListener("click", (e) => {
    e.stopPropagation();
    if (running) stop();
  });

  document.addEventListener("click", (e) => {
    if (lastPointer === "touch" || running) return;
    if (e.target.closest("a, button, .toast") || isOverContent(e.clientX, e.clientY)) return;
    start(e.clientX, e.clientY);
  });

  addEventListener("keydown", (e) => {
    if (running && e.key === "Escape") stop();
  });
}

if (!reducedMotion) scrambleTitle();
renderAccounts();
startStars();
setupGame();
</script>
