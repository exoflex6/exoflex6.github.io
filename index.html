<title>exoflex6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500&family=Unbounded:wght@500;800&display=swap">

<style>
:root {
  color-scheme: dark;
  --bg: #05080f;
  --card: #0b111d;
  --card-hover: #101828;
  --border: #1a2436;
  --text: #eef3ff;
  --muted: #7d8aa3;
  --blue: #4aa8ff;
  --heal: #3ddc84;
  --shield: #6ee7ff;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

html {
  background: var(--bg);
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  -webkit-font-smoothing: antialiased;
}

::selection {
  background: var(--blue);
  color: var(--bg);
}

#stars,
#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#stars {
  z-index: 0;
}

.glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(60% 40% at 50% 0%, rgba(40, 110, 220, .16), transparent 70%);
}

main {
  position: relative;
  z-index: 1;
  box-sizing: border-box;
  display: grid;
  align-content: center;
  gap: 36px;
  max-width: 560px;
  min-height: 100vh;
  margin: 0 auto;
  padding-block: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity .3s, transform .3s;
}

h1 {
  margin: 0;
  text-align: center;
  white-space: nowrap;
  font-family: var(--font-display);
  font-size: clamp(30px, 11vw, 72px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.04em;
}

h1 span {
  color: var(--blue);
}

.accounts {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.account {
  position: relative;
  transition: transform .4s cubic-bezier(.25, 1.25, .4, 1);
  animation: fade-in .5s ease-out backwards;
  animation-delay: calc(var(--i) * 50ms);
}

.account:hover,
.account:has(:focus-visible) {
  z-index: 2;
  transform: scale(1.035);
}

.account:active {
  transform: scale(.985);
  transition-duration: .15s;
}

.card {
  box-sizing: border-box;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  width: 100%;
  margin: 0;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: inherit;
  font: inherit;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background .35s, border-color .35s, box-shadow .4s;
}

.account:hover .card,
.card:focus-visible {
  border-color: var(--brand);
  background: var(--card-hover);
  box-shadow: 0 12px 36px -14px color-mix(in srgb, var(--brand) 70%, transparent);
}

.card:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 3px;
}

.logo {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: #131c2d;
  transition: background .35s;
}

.logo svg {
  width: 22px;
  height: 22px;
  fill: var(--text);
  transition: fill .35s, transform .35s;
}

.account:hover .logo {
  background: var(--brand);
}

.account:hover .logo svg {
  fill: var(--brand-text);
  transform: scale(1.1);
}

.info {
  display: grid;
  gap: 6px;
  min-width: 0;
}

.platform {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.handle {
  overflow: hidden;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.handle em {
  color: var(--muted);
  font-style: normal;
}

.action {
  box-sizing: border-box;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 9px;
  color: var(--muted);
  transition: background .35s, color .35s, border-color .35s;
}

.action svg {
  width: 16px;
  height: 16px;
  transition: transform .35s;
}

.account:hover .action {
  color: var(--text);
}

.account.link:hover .action {
  border-color: transparent;
  background: var(--brand);
  color: var(--brand-text);
}

.account.link:hover .action svg {
  transform: translate(1px, -1px);
}

.hint {
  margin: 0;
  color: #3a4760;
  font-size: 10px;
  letter-spacing: .16em;
  text-align: center;
  text-transform: uppercase;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  z-index: 70;
  max-width: calc(100vw - 32px);
  overflow: hidden;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card-hover);
  font-size: 12px;
  white-space: nowrap;
  text-overflow: ellipsis;
  opacity: 0;
  transform: translate(-50%, 16px);
  pointer-events: none;
  transition: transform .2s ease-out, opacity .2s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.spark {
  position: fixed;
  z-index: 60;
  width: 5px;
  height: 5px;
  border-radius: 1px;
  background: var(--brand);
  pointer-events: none;
  animation: spark .7s cubic-bezier(.1, .7, .3, 1) forwards;
}

@keyframes fade-in {
  from { opacity: 0; }
}

@keyframes spark {
  to {
    opacity: 0;
    transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(0);
  }
}

body.playing {
  cursor: none;
}

body.playing main {
  opacity: 0;
  transform: scale(.97);
  pointer-events: none;
}

#game {
  z-index: 30;
  touch-action: none;
}

.hud {
  position: fixed;
  inset: 0;
  z-index: 31;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}

body.playing .hud {
  opacity: 1;
}

.hud [hidden] {
  display: none;
}

.score {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  left: max(20px, env(safe-area-inset-left, 0px));
  color: var(--text);
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}

.score small {
  display: block;
  margin-top: 6px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: .14em;
}

.lives {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  right: max(20px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 6px;
}

.lives i {
  width: 0;
  height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 14px solid var(--blue);
}

.lives i.extra {
  border-bottom-color: var(--shield);
}

.lives i.lost {
  border-bottom-color: var(--border);
}

.lives b {
  box-sizing: border-box;
  width: 16px;
  height: 16px;
  margin-left: 6px;
  border: 2px solid var(--shield);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--shield);
}

.boss-bar {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 24px);
  left: 50%;
  display: grid;
  gap: 6px;
  width: min(320px, 50vw);
  text-align: center;
  transform: translateX(-50%);
}

.boss-bar div {
  height: 4px;
  overflow: hidden;
  border-radius: 2px;
  background: var(--border);
}

.boss-bar i {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--blue);
  transition: width .15s;
}

.banner,
.game-over {
  position: absolute;
  left: 50%;
  display: grid;
  gap: 12px;
  text-align: center;
  transform: translate(-50%, -50%);
}

.banner {
  top: 32%;
  opacity: 0;
}

.banner.show {
  animation: banner 1.8s ease forwards;
}

.banner span {
  color: var(--blue);
}

.game-over {
  top: 50%;
}

.banner b,
.game-over b {
  color: var(--text);
  font-family: var(--font-display);
  font-size: clamp(26px, 7vw, 50px);
  font-weight: 800;
  letter-spacing: -.03em;
  text-transform: none;
}

.game-over small {
  color: #4b5874;
  font-size: inherit;
}

.controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  text-align: center;
}

@keyframes banner {
  0% { opacity: 0; transform: translate(-50%, -40%); }
  15%, 75% { opacity: 1; transform: translate(-50%, -50%); }
  100% { opacity: 0; transform: translate(-50%, -56%); }
}

@media (max-width: 420px) {
  .card { gap: 12px; padding: 12px; }
  .logo { width: 40px; height: 40px; }
  .handle { font-size: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  .account,
  .spark {
    animation: none !important;
  }
}
</style>

const ARROW_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11 11 5M6 5h5v5"/></svg>';
const COPY_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5.5" y="5.5" width="7.5" height="7.5" rx="1.5"/><path d="M3 10.5V4a1 1 0 0 1 1-1h6.5"/></svg>';

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const random = (min, max) => min + Math.random() * (max - min);

function scrambleTitle() {
  const title = document.getElementById("name");
  const text = "exoflex6";
  const glyphs = "#/<>_=+*0123456789XO";
  const frames = 18;
  let frame = 0;

  const tick = () => {
    frame++;
    const revealed = Math.floor((frame / frames) * text.length);
    const chars = [...text].map((c, i) => i < revealed ? c : glyphs[Math.floor(Math.random() * glyphs.length)]);
    title.innerHTML = chars.slice(0, 7).join("") + `<span>${chars[7]}</span>`;
    if (frame < frames) setTimeout(tick, 35);
  };
  tick();
}

const toast = document.getElementById("toast");
let toastTimer;

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1700);
}

function sparks(x, y, color) {
  if (reducedMotion) return;

  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12 + Math.random() * .4;
    const dist = random(30, 70);
    const spark = document.createElement("span");
    spark.className = "spark";
    spark.style.cssText = `left:${x - 2}px; top:${y - 2}px; --brand:${color}; --dx:${Math.cos(angle) * dist}px; --dy:${Math.sin(angle) * dist}px; --r:${Math.random() * 360}deg`;
    document.body.appendChild(spark);
    setTimeout(() => spark.remove(), 750);
  }
}

function copyFallback(text) {
  try {
    const input = document.createElement("textarea");
    input.value = text;
    input.setAttribute("readonly", "");
    input.style.cssText = "position: fixed; opacity: 0";
    document.body.appendChild(input);
    input.select();
    const ok = document.execCommand("copy");
    input.remove();
    return ok;
  } catch {
    return false;
  }
}

function copyName(account, x, y) {
  const text = account.name + (account.tag || "");
  const copied = () => showToast(`Copied ${text}`);
  const failed = () => showToast(`${account.platform}: ${text}`);

  sparks(x, y, account.brand);
  try {
    navigator.clipboard.writeText(text).then(copied, () => copyFallback(text) ? copied() : failed());
  } catch {
    copyFallback(text) ? copied() : failed();
  }
}

function renderAccounts() {
  const list = document.getElementById("accounts");

  ACCOUNTS.forEach((account, i) => {
    const fullName = account.name + (account.tag || "");
    const inner = `
      <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[account.icon]}"/></svg></span>
      <span class="info">
        <span class="platform">${account.platform}</span>
        <span class="handle">${account.name}${account.tag ? `<em>${account.tag}</em>` : ""}</span>
      </span>
      <span class="action" aria-hidden="true">${account.url ? ARROW_ICON : COPY_ICON}</span>`;

    const item = document.createElement("li");
    item.className = account.url ? "account link" : "account";
    item.style.cssText = `--brand:${account.brand}; --brand-text:${account.brandText}; --i:${i}`;

    if (account.url) {
      item.innerHTML = `<a class="card" href="${account.url}" target="_blank" rel="noopener" aria-label="Open ${account.platform} profile">${inner}</a>`;
    } else {
      item.innerHTML = `<button class="card" type="button" aria-label="Copy ${account.platform} name ${fullName}">${inner}</button>`;
      const button = item.querySelector("button");
      button.addEventListener("click", (e) => {
        const box = button.getBoundingClientRect();
        copyName(account, e.clientX || box.left + box.width / 2, e.clientY || box.top + box.height / 2);
      });
    }

    list.appendChild(item);
  });
}

function startStars() {
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let width, height, dpr;
  let stars = [];
  let meteors = [];
  let parallaxX = 0, parallaxY = 0, mouseX = 0, mouseY = 0;

  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    width = canvas.width = innerWidth * dpr;
    height = canvas.height = innerHeight * dpr;

    const count = Math.round((innerWidth * innerHeight) / 3200);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      depth: Math.random() ** 2.2,
      phase: Math.random() * 7,
      twinkle: random(.6, 2.2),
    }));

    if (reducedMotion) draw(0);
  }

  function draw(time) {
    ctx.clearRect(0, 0, width, height);
    parallaxX += (mouseX - parallaxX) * .04;
    parallaxY += (mouseY - parallaxY) * .04;

    for (const star of stars) {
      const x = (((star.x - parallaxX * 50 * dpr * star.depth) % width) + width) % width;
      const y = (((star.y - parallaxY * 50 * dpr * star.depth + time * .003 * star.depth * dpr) % height) + height) % height;
      const twinkle = reducedMotion ? 1 : .6 + .4 * Math.sin(time * .001 * star.twinkle + star.phase);
      ctx.fillStyle = `rgba(205, 225, 255, ${(.2 + star.depth * .7) * twinkle})`;
      ctx.beginPath();
      ctx.arc(x, y, (.35 + star.depth * 1.3) * dpr, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const m of meteors) {
      m.age++;
      const x = m.x + m.vx * m.age;
      const y = m.y + m.vy * m.age;
      const tail = ctx.createLinearGradient(x, y, x - m.vx * 12, y - m.vy * 12);
      tail.addColorStop(0, `rgba(210, 230, 255, ${(1 - m.age / m.lifetime) * .8})`);
      tail.addColorStop(1, "rgba(210, 230, 255, 0)");
      ctx.strokeStyle = tail;
      ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - m.vx * 12, y - m.vy * 12);
      ctx.stroke();
    }
    meteors = meteors.filter((m) => m.age < m.lifetime);
  }

  function shootingStar() {
    const angle = Math.PI * random(.15, .27);
    const speed = random(9, 15) * dpr;
    meteors.push({
      x: Math.random() * width * .8,
      y: Math.random() * height * .4,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      age: 0,
      lifetime: random(50, 80),
    });
    setTimeout(shootingStar, random(5000, 12000));
  }

  addEventListener("resize", resize);
  addEventListener("pointermove", (e) => {
    mouseX = e.clientX / innerWidth - .5;
    mouseY = e.clientY / innerHeight - .5;
  });

  resize();
  if (reducedMotion) return;

  const frame = (time) => {
    if (!document.hidden) draw(time);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  setTimeout(shootingStar, 2500);
}

function setupGame() {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const ui = {
    score: $("score"),
    levelBest: $("level-best"),
    lives: $("lives"),
    bossBar: $("boss-bar"),
    bossHealth: $("boss-health"),
    banner: $("banner"),
    gameOver: $("game-over"),
    finalScore: $("final-score"),
  };

  const TAU = Math.PI * 2;
  const POINTS_PER_LEVEL = 350;
  const START_LIVES = 3;
  const MAX_LIVES = 5;
  const TITLE_TIME = 1.8;

  const ENEMIES = {
    rock:   { level: 1, weight: (lvl) => Math.max(1.5, 5 - lvl * .5) },
    drone:  { level: 2, weight: () => 3,   radius: 12, hp: 1, points: 50,  color: "#ff4d6d", name: "Drones" },
    dart:   { level: 3, weight: () => 2.5, radius: 9,  hp: 1, points: 75,  color: "#ffd34d", name: "Darts" },
    tank:   { level: 4, weight: () => 1.5, radius: 26, hp: 6, points: 120, color: "#ff9a3d", name: "Tanks" },
    gunner: { level: 5, weight: () => 1.4, radius: 16, hp: 3, points: 150, color: "#b77bff", name: "Gunners" },
  };
  const BOSS_POINTS = 1000;

  const HEALTH_DROP = { rock: .01, drone: .02, dart: .02, tank: .08, gunner: .06, boss: .5 };
  const SHIELD_DROP = { rock: .002, drone: .004, dart: .004, tank: .015, gunner: .01, boss: .1 };
  const HEALTH_PER_LEVEL = .6;

  let running = false;
  let width = 0, height = 0;
  let frameId = 0, lastTime = 0;
  let best = loadBest();
  let state;

  function loadBest() {
    try {
      const match = document.cookie.match(/(?:^|;\s*)exoBest=(\d+)/);
      if (match) return Number(match[1]);
    } catch {}
    try {
      return Number(localStorage.getItem("exo-best")) || 0;
    } catch {
      return 0;
    }
  }

  function saveBest(score) {
    try { document.cookie = `exoBest=${score}; max-age=31536000; path=/; SameSite=Lax`; } catch {}
    try { localStorage.setItem("exo-best", score); } catch {}
  }

  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    width = innerWidth;
    height = innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function updateHud() {
    const s = state;
    ui.score.textContent = s.score;
    ui.levelBest.textContent = `Level ${s.level} · Best ${Math.max(best, s.score)}`;

    let lives = "";
    for (let i = 0; i < Math.max(START_LIVES, s.lives); i++) {
      const cls = i >= s.lives ? "lost" : i >= START_LIVES ? "extra" : "";
      lives += `<i class="${cls}"></i>`;
    }
    if (s.ship.shield) lives += '<b title="Shield"></b>';
    ui.lives.innerHTML = lives;
  }

  function showBanner(title, subtitle = "") {
    ui.banner.innerHTML = `<b>${title}</b>` + (subtitle ? `<span>${subtitle}</span>` : "");
    ui.banner.classList.remove("show");
    void ui.banner.offsetWidth;
    ui.banner.classList.add("show");
  }

  function floatText(x, y, text, color) {
    state.texts.push({ x, y, text, color, life: 1.1 });
  }

  function start(x, y) {
    running = true;
    resize();
    document.body.classList.add("playing");

    state = {
      ship: { x, y, targetX: x, targetY: y, angle: -Math.PI / 2, targetAngle: -Math.PI / 2, shield: false },
      bullets: [],
      enemyShots: [],
      enemies: [],
      particles: [],
      powerups: [],
      texts: [],
      boss: null,
      score: 0,
      lives: START_LIVES,
      level: 1,
      spawnLevel: 1,
      titleTimer: TITLE_TIME,
      spawnTimer: 0,
      shieldTimer: random(120, 180),
      healthTimer: Infinity,
      invincible: 1.2,
      shake: 0,
      over: false,
      distanceMoved: 0,
      lastShot: 0,
      lastMove: 0,
    };

    ui.gameOver.hidden = true;
    ui.bossBar.hidden = true;
    updateHud();
    showBanner("Level 1", "Move to fly and shoot");

    lastTime = performance.now();
    frameId = requestAnimationFrame(loop);
  }

  function stop() {
    running = false;
    cancelAnimationFrame(frameId);
    document.body.classList.remove("playing");
    ui.banner.classList.remove("show");
    ctx.clearRect(0, 0, width, height);
  }

  function offscreenPoint(margin = 60) {
    const side = Math.floor(Math.random() * 4);
    return {
      x: side === 0 ? -margin : side === 1 ? width + margin : random(0, width),
      y: side === 2 ? -margin : side === 3 ? height + margin : random(0, height),
    };
  }

  function pickEnemy() {
    const lvl = state.spawnLevel;
    const options = Object.entries(ENEMIES).filter(([, e]) => lvl >= e.level);
    let roll = Math.random() * options.reduce((sum, [, e]) => sum + e.weight(lvl), 0);
    for (const [kind, e] of options) {
      roll -= e.weight(lvl);
      if (roll <= 0) return kind;
    }
    return "rock";
  }

  function makeRock(x, y, radius, vx, vy, shape) {
    const hp = radius > 30 ? 2 : 1;
    return {
      kind: "rock", x, y, vx, vy, radius, hp, maxHp: hp,
      shape: shape || Array.from({ length: 9 + Math.floor(Math.random() * 4) }, () => random(.72, 1.08)),
      rotation: random(0, TAU),
      spin: random(-1.4, 1.4),
      age: 0,
    };
  }

  function spawnEnemy() {
    const s = state;
    const kind = pickEnemy();
    const { x, y } = offscreenPoint();

    if (kind === "rock") {
      const aim = Math.atan2(random(height * .2, height * .8) - y, random(width * .2, width * .8) - x);
      const speed = random(50, 110) + s.level * 8;
      s.enemies.push(makeRock(x, y, random(18, 40), Math.cos(aim) * speed, Math.sin(aim) * speed));
      return;
    }

    const type = ENEMIES[kind];
    const enemy = {
      kind, x, y, vx: 0, vy: 0,
      radius: type.radius, hp: type.hp, maxHp: type.hp,
      rotation: 0, spin: 0, age: 0,
      cooldown: random(1, 2),
    };

    if (kind === "dart") {
      const aim = Math.atan2(s.ship.y - y, s.ship.x - x);
      const speed = 300 + s.level * 15;
      enemy.vx = Math.cos(aim) * speed;
      enemy.vy = Math.sin(aim) * speed;
      enemy.rotation = aim;
    }

    s.enemies.push(enemy);
  }

  function spawnBoss() {
    const hp = 30 + state.level * 6;
    state.boss = {
      kind: "boss", x: width / 2, y: -80, vx: 0, vy: 0,
      radius: 50, hp, maxHp: hp,
      rotation: 0, spin: .4, age: 0, cooldown: 2,
    };
    state.enemies.push(state.boss);
    ui.bossBar.hidden = false;
  }

  function canDropHealth() {
    return state.level >= 3 && state.lives < MAX_LIVES;
  }

  function canDropShield() {
    const onScreen = state.powerups.filter((p) => p.kind === "shield").length;
    return onScreen < (state.ship.shield ? 2 : 3);
  }

  function dropPowerup(x, y, kind) {
    if (kind === "health" ? !canDropHealth() : !canDropShield()) return;
    const angle = random(0, TAU);
    state.powerups.push({ kind, x, y, vx: Math.cos(angle) * 30, vy: Math.sin(angle) * 30, age: 0, lifetime: 9 });
  }

  function collectPowerup(p) {
    const s = state;
    const color = p.kind === "health" ? "#3ddc84" : "#6ee7ff";
    explode(p.x, p.y, color, 18, 180);

    if (p.kind === "health" && s.lives < MAX_LIVES) {
      s.lives++;
      floatText(p.x, p.y - 20, s.lives > START_LIVES ? "+1 Extra life" : "+1 Life", color);
    } else if (p.kind === "shield" && !s.ship.shield) {
      s.ship.shield = true;
      floatText(p.x, p.y - 20, "Shield", color);
    } else {
      s.score += 50;
      floatText(p.x, p.y - 20, "+50", color);
    }
    updateHud();
  }

  function explode(x, y, color, count, speed = 260) {
    for (let i = 0; i < count; i++) {
      const angle = random(0, TAU);
      const v = random(.2, 1) * speed;
      state.particles.push({ x, y, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v, life: random(.35, .8), maxLife: .8, color, size: random(1.2, 2.8) });
    }
  }

  function fire(now) {
    const { ship } = state;
    const spread = state.level >= 6 ? [-.08, .08] : [0];
    for (const offset of spread) {
      const angle = ship.angle + offset;
      state.bullets.push({
        x: ship.x + Math.cos(ship.angle) * 14,
        y: ship.y + Math.sin(ship.angle) * 14,
        vx: Math.cos(angle) * 980,
        vy: Math.sin(angle) * 980,
        life: .9,
      });
    }
    state.lastShot = now;
  }

  function enemyFire(enemy, angle, speed) {
    state.enemyShots.push({
      x: enemy.x + Math.cos(angle) * enemy.radius,
      y: enemy.y + Math.sin(angle) * enemy.radius,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 5,
      color: enemy.kind === "boss" ? "#7cc4ff" : ENEMIES.gunner.color,
    });
  }

  function hitShip() {
    const s = state;

    if (s.ship.shield) {
      s.ship.shield = false;
      s.invincible = 2.2;
      s.shake = 8;
      for (const shot of s.enemyShots) {
        if ((shot.x - s.ship.x) ** 2 + (shot.y - s.ship.y) ** 2 < 140 ** 2) shot.life = 0;
      }
      for (const e of s.enemies) {
        if (e.kind === "boss" || e.dead) continue;
        const dx = e.x - s.ship.x, dy = e.y - s.ship.y;
        const dist = Math.hypot(dx, dy) || 1;
        if (dist < e.radius + 70) {
          e.vx = (dx / dist) * 260;
          e.vy = (dy / dist) * 260;
        }
      }
      explode(s.ship.x, s.ship.y, "#6ee7ff", 30, 260);
      floatText(s.ship.x, s.ship.y - 24, "Shield broke", "#6ee7ff");
      updateHud();
      return;
    }

    s.lives--;
    s.invincible = 1.8;
    s.shake = 14;
    explode(s.ship.x, s.ship.y, "#4aa8ff", 40, 320);

    if (s.lives <= 0) {
      s.over = true;
      const newBest = s.score > best;
      if (newBest) {
        best = s.score;
        saveBest(best);
      }
      ui.finalScore.textContent = (newBest ? "New best · " : "") + `Score ${s.score} · Level ${s.level}`;
      ui.gameOver.hidden = false;
    }
    updateHud();
  }

  function destroy(enemy) {
    const s = state;
    enemy.dead = true;

    if (Math.random() < (HEALTH_DROP[enemy.kind] || 0)) dropPowerup(enemy.x - 14, enemy.y, "health");
    if (Math.random() < (SHIELD_DROP[enemy.kind] || 0)) dropPowerup(enemy.x + 14, enemy.y, "shield");

    if (enemy.kind === "rock") {
      s.score += enemy.radius > 30 ? 20 : 10;
      explode(enemy.x, enemy.y, "#9fb3d6", 18);

      if (enemy.radius > 24) {
        for (let i = 0; i < 2; i++) {
          const angle = random(0, TAU);
          const speed = Math.hypot(enemy.vx, enemy.vy) * 1.3 + 30;
          const piece = makeRock(enemy.x, enemy.y, enemy.radius * .58, Math.cos(angle) * speed, Math.sin(angle) * speed, enemy.shape.map((p) => p * random(.92, 1.08)));
          piece.age = 1;
          s.enemies.push(piece);
        }
      }
    } else if (enemy.kind === "boss") {
      s.score += BOSS_POINTS;
      s.shake = 20;
      s.boss = null;
      ui.bossBar.hidden = true;
      for (let i = 0; i < 5; i++) {
        setTimeout(() => running && explode(enemy.x + random(-40, 40), enemy.y + random(-40, 40), i % 2 ? "#4aa8ff" : "#eef3ff", 40, 380), i * 120);
      }
      showBanner("Mothership down", `+${BOSS_POINTS}`);
    } else {
      const type = ENEMIES[enemy.kind];
      s.score += type.points;
      explode(enemy.x, enemy.y, type.color, enemy.kind === "tank" ? 40 : 24);
    }

    const level = 1 + Math.floor(s.score / POINTS_PER_LEVEL);
    if (level > s.level) {
      s.level = level;
      s.titleTimer = TITLE_TIME;
      const newEnemy = Object.values(ENEMIES).find((e) => e.level === level);
      let subtitle = "";
      if (level % 3 === 0) subtitle = "Mothership incoming";
      else if (newEnemy) subtitle = `New enemy: ${newEnemy.name}`;
      else if (level === 6) subtitle = "Twin cannons online";
      showBanner(`Level ${level}`, subtitle);
    }

    updateHud();
  }

  function updateShip(dt, now) {
    const { ship } = state;
    ship.x += (ship.targetX - ship.x) * (1 - Math.pow(.0005, dt));
    ship.y += (ship.targetY - ship.y) * (1 - Math.pow(.0005, dt));

    let turn = ship.targetAngle - ship.angle;
    turn = Math.atan2(Math.sin(turn), Math.cos(turn));
    ship.angle += turn * (1 - Math.pow(.00002, dt));

    const moving = now - state.lastMove < 120;
    if (!moving) state.distanceMoved = 0;
    if (state.distanceMoved > 16 && now - state.lastShot > 85) {
      fire(now);
      state.distanceMoved = 0;
    }

    if (moving && Math.random() < .7) {
      const angle = ship.angle + Math.PI + random(-.4, .4);
      state.particles.push({
        x: ship.x - Math.cos(ship.angle) * 10,
        y: ship.y - Math.sin(ship.angle) * 10,
        vx: Math.cos(angle) * 90, vy: Math.sin(angle) * 90,
        life: .3, maxLife: .3, color: "#7cc4ff", size: 1.6,
      });
    }
  }

  function updateSpawning(dt) {
    const s = state;

    if (s.titleTimer > 0) {
      s.titleTimer -= dt;
      if (s.titleTimer <= 0) {
        s.spawnLevel = s.level;
        s.spawnTimer = 0;
        if (s.level % 3 === 0 && !s.boss) spawnBoss();
        if (s.level === 1) {
          spawnEnemy();
          spawnEnemy();
        }
        s.healthTimer = s.level >= 3 && Math.random() < HEALTH_PER_LEVEL ? random(4, 15) : Infinity;
      }
      return;
    }

    s.spawnTimer -= dt;
    if (s.spawnTimer <= 0) {
      spawnEnemy();
      s.spawnTimer = Math.max(.32, 1.1 - s.spawnLevel * .08) * (s.boss ? 1.8 : 1);
    }

    s.shieldTimer -= dt;
    if (s.shieldTimer <= 0) {
      dropPowerup(random(60, width - 60), random(60, height - 60), "shield");
      s.shieldTimer = random(120, 180);
    }

    s.healthTimer -= dt;
    if (s.healthTimer <= 0) {
      s.healthTimer = Infinity;
      dropPowerup(random(60, width - 60), random(60, height - 60), "health");
    }
  }

  function updateEnemies(dt) {
    const s = state;
    const { ship } = s;

    for (const e of s.enemies) {
      e.age += dt;
      e.rotation += e.spin * dt;
      const toShip = Math.atan2(ship.y - e.y, ship.x - e.x);
      const dist = Math.hypot(ship.x - e.x, ship.y - e.y);

      if (e.kind === "drone" || e.kind === "tank") {
        const speed = e.kind === "tank" ? 45 + s.level * 3 : 120 + s.level * 8;
        const steer = Math.min(1, dt * (e.kind === "tank" ? .8 : 1.6));
        e.vx += (Math.cos(toShip) * speed - e.vx) * steer;
        e.vy += (Math.sin(toShip) * speed - e.vy) * steer;
        e.rotation = e.kind === "drone" ? Math.atan2(e.vy, e.vx) : e.rotation + dt * .5;
      }

      if (e.kind === "gunner") {
        const approach = dist > 260 ? 1 : dist < 180 ? -1 : 0;
        const sideways = toShip + Math.PI / 2;
        const steer = Math.min(1, dt * 2);
        e.vx += (Math.cos(toShip) * approach * 140 + Math.cos(sideways) * 60 - e.vx) * steer;
        e.vy += (Math.sin(toShip) * approach * 140 + Math.sin(sideways) * 60 - e.vy) * steer;
        e.rotation = toShip;

        e.cooldown -= dt;
        if (!s.over && e.cooldown <= 0 && e.age > 1) {
          enemyFire(e, toShip, 240);
          e.cooldown = Math.max(.9, 2 - s.level * .08);
        }
      }

      if (e.kind === "boss") {
        const targetX = width / 2 + Math.sin(e.age * .6) * width * .3;
        const targetY = Math.min(140, height * .22);
        e.vx = (targetX - e.x) * 1.2;
        e.vy = (targetY - e.y) * 1.5;

        e.cooldown -= dt;
        if (!s.over && e.cooldown <= 0 && e.age > 2) {
          const enraged = e.hp < e.maxHp / 2;
          const count = enraged ? 7 : 5;
          for (let i = 0; i < count; i++) enemyFire(e, toShip + (i - (count - 1) / 2) * .22, 220);
          e.cooldown = enraged ? 1.1 : 1.6;
        }
        ui.bossHealth.style.width = (e.hp / e.maxHp) * 100 + "%";
      }

      e.x += e.vx * dt;
      e.y += e.vy * dt;

      if (e.kind === "dart" && Math.random() < .6) {
        s.particles.push({ x: e.x, y: e.y, vx: 0, vy: 0, life: .25, maxLife: .25, color: "#ffd34d", size: 2 });
      }
    }
  }

  function checkCollisions() {
    const s = state;
    const { ship } = s;
    const canBeHit = () => !s.over && s.invincible <= 0;

    for (const e of s.enemies) {
      for (const b of s.bullets) {
        if (e.dead || b.life <= 0) continue;
        if ((b.x - e.x) ** 2 + (b.y - e.y) ** 2 < (e.radius + 3) ** 2) {
          b.life = 0;
          e.hp--;
          e.flash = .08;
          const color = e.kind === "rock" ? "#9fb3d6" : e.kind === "boss" ? "#eef3ff" : ENEMIES[e.kind].color;
          explode(b.x, b.y, color, 5, 140);
          if (e.hp <= 0) destroy(e);
        }
      }

      if (!e.dead && canBeHit() && (ship.x - e.x) ** 2 + (ship.y - e.y) ** 2 < (e.radius + 9) ** 2) {
        if (e.kind !== "boss") {
          e.dead = true;
          explode(e.x, e.y, "#9fb3d6", 16);
        }
        hitShip();
      }
    }

    for (const shot of s.enemyShots) {
      if (shot.life > 0 && canBeHit() && (ship.x - shot.x) ** 2 + (ship.y - shot.y) ** 2 < 100) {
        shot.life = 0;
        hitShip();
      }
    }

    for (const p of s.powerups) {
      if (!s.over && (ship.x - p.x) ** 2 + (ship.y - p.y) ** 2 < 26 ** 2) {
        p.collected = true;
        collectPowerup(p);
      }
    }
  }

  function onScreen(obj, margin) {
    return obj.x > -margin && obj.x < width + margin && obj.y > -margin && obj.y < height + margin;
  }

  function loop(now) {
    const s = state;
    const dt = Math.min(.05, (now - lastTime) / 1000);
    lastTime = now;

    if (!s.over) {
      updateShip(dt, now);
      updateSpawning(dt);
      s.invincible = Math.max(0, s.invincible - dt);
    }

    for (const list of [s.bullets, s.enemyShots]) {
      for (const b of list) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
      }
    }

    updateEnemies(dt);

    for (const p of s.powerups) {
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= .99;
      p.vy *= .99;
      if (p.x < 20 || p.x > width - 20) p.vx *= -1;
      if (p.y < 20 || p.y > height - 20) p.vy *= -1;
    }

    checkCollisions();

    for (const e of s.enemies) {
      if (e.flash) e.flash = Math.max(0, e.flash - dt);
    }
    for (const p of s.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= .96;
      p.vy *= .96;
      p.life -= dt;
    }
    for (const t of s.texts) {
      t.y -= 30 * dt;
      t.life -= dt;
    }

    s.bullets = s.bullets.filter((b) => b.life > 0 && onScreen(b, 20));
    s.enemyShots = s.enemyShots.filter((b) => b.life > 0 && onScreen(b, 30));
    s.enemies = s.enemies.filter((e) => !e.dead && (e.kind === "boss" || e.age < 3 || onScreen(e, 150)));
    s.powerups = s.powerups.filter((p) => !p.collected && p.age < p.lifetime);
    s.particles = s.particles.filter((p) => p.life > 0);
    s.texts = s.texts.filter((t) => t.life > 0);
    s.shake = Math.max(0, s.shake - dt * 40);

    draw(now);
    frameId = requestAnimationFrame(loop);
  }

  function polygon(sides, radius, rotation = 0) {
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
      const a = rotation + (i / sides) * TAU;
      ctx.lineTo(Math.cos(a) * radius, Math.sin(a) * radius);
    }
    ctx.closePath();
  }

  function circle(x, y, radius) {
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, TAU);
  }

  function drawHealthBar(e) {
    if (e.kind === "boss" || e.maxHp <= 1 || e.hp === e.maxHp) return;
    const w = e.radius * 1.6;
    const x = e.x - w / 2, y = e.y - e.radius - 10;
    ctx.fillStyle = "#1a2436";
    ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = e.kind === "rock" ? "#a9bbdc" : ENEMIES[e.kind].color;
    ctx.fillRect(x, y, w * e.hp / e.maxHp, 3);
  }

  function drawEnemy(e, now) {
    const hit = e.flash > 0;

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.rotation);

    switch (e.kind) {
      case "rock":
        ctx.beginPath();
        e.shape.forEach((r, i) => {
          const a = (i / e.shape.length) * TAU;
          ctx.lineTo(Math.cos(a) * e.radius * r, Math.sin(a) * e.radius * r);
        });
        ctx.closePath();
        ctx.fillStyle = hit ? "#2a3a5c" : "#0d1526";
        ctx.fill();
        ctx.strokeStyle = e.hp > 1 ? "#a9bbdc" : "#6f82a6";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        break;

      case "drone":
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(0, 9);
        ctx.lineTo(-10, 0);
        ctx.lineTo(0, -9);
        ctx.closePath();
        ctx.fillStyle = "#2a0b14";
        ctx.fill();
        ctx.strokeStyle = "#ff4d6d";
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.fillStyle = "#ff4d6d";
        circle(2, 0, 2.2 + Math.sin(now / 90) * .8);
        ctx.fill();
        break;

      case "dart":
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(-8, -6);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-8, 6);
        ctx.closePath();
        ctx.fillStyle = "#ffd34d";
        ctx.fill();
        break;

      case "tank":
        polygon(6, e.radius);
        ctx.fillStyle = hit ? "#4a2a10" : "#1f1408";
        ctx.fill();
        ctx.strokeStyle = "#ff9a3d";
        ctx.lineWidth = 2;
        ctx.stroke();
        polygon(6, e.radius * .55, Math.PI / 6);
        ctx.strokeStyle = "rgba(255, 154, 61, .6)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "#ff9a3d";
        circle(0, 0, 3);
        ctx.fill();
        break;

      case "gunner":
        circle(0, 0, e.radius);
        ctx.fillStyle = hit ? "#3a2060" : "#170d26";
        ctx.fill();
        ctx.strokeStyle = "#b77bff";
        ctx.lineWidth = 1.8;
        ctx.stroke();
        ctx.fillStyle = "#b77bff";
        ctx.fillRect(e.radius - 4, -3, 12, 6);
        circle(0, 0, 5);
        ctx.fill();
        break;

      case "boss":
        polygon(8, e.radius, Math.PI / 8);
        ctx.fillStyle = hit ? "#1c3358" : "#0a1428";
        ctx.fill();
        ctx.strokeStyle = "#4aa8ff";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.rotate(e.age * 1.2);
        polygon(8, e.radius * .66);
        ctx.strokeStyle = "rgba(74, 168, 255, .55)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "#4aa8ff";
        for (let i = 0; i < 4; i++) {
          ctx.rotate(TAU / 4);
          ctx.fillRect(e.radius * .66 - 3, -3, 6, 6);
        }

        ctx.fillStyle = e.hp < e.maxHp / 2 ? "#ff4d6d" : "#eef3ff";
        circle(0, 0, 9 + Math.sin(now / 120) * 2);
        ctx.fill();
        break;
    }

    ctx.restore();
    drawHealthBar(e);
  }

  function drawPowerup(p, now) {
    const color = p.kind === "health" ? "#3ddc84" : "#6ee7ff";
    const blinking = p.lifetime - p.age < 2 && Math.floor(now / 120) % 2;
    const alpha = blinking ? .3 : 1;

    ctx.save();
    ctx.translate(p.x, p.y + Math.sin(p.age * 4) * 2);

    ctx.fillStyle = color;
    ctx.globalAlpha = alpha * (.15 + .1 * Math.sin(p.age * 6));
    circle(0, 0, 18);
    ctx.fill();

    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    circle(0, 0, 12);
    ctx.stroke();

    if (p.kind === "health") {
      ctx.fillRect(-1.5, -6, 3, 12);
      ctx.fillRect(-6, -1.5, 12, 3);
    } else {
      ctx.beginPath();
      ctx.moveTo(0, -7);
      ctx.lineTo(6, -4);
      ctx.lineTo(5, 3);
      ctx.lineTo(0, 7);
      ctx.lineTo(-5, 3);
      ctx.lineTo(-6, -4);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function drawShip(now) {
    const { ship } = state;
    const blinking = state.invincible > 0 && Math.floor(now / 90) % 2;

    if (!blinking) {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle);

      if (now - state.lastMove < 120) {
        ctx.fillStyle = "#4aa8ff";
        ctx.beginPath();
        ctx.moveTo(-8, -4);
        ctx.lineTo(-15 - Math.random() * 8, 0);
        ctx.lineTo(-8, 4);
        ctx.closePath();
        ctx.fill();
      }

      ctx.beginPath();
      ctx.moveTo(15, 0);
      ctx.lineTo(-9, -10);
      ctx.lineTo(-5, 0);
      ctx.lineTo(-9, 10);
      ctx.closePath();
      ctx.fillStyle = "#eef3ff";
      ctx.fill();
      ctx.strokeStyle = "#4aa8ff";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    if (ship.shield) {
      ctx.strokeStyle = "#6ee7ff";
      ctx.lineWidth = 2;
      ctx.globalAlpha = .55 + .25 * Math.sin(now / 150);
      circle(ship.x, ship.y, 22);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function draw(now) {
    const s = state;
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    if (s.shake) ctx.translate(random(-s.shake, s.shake), random(-s.shake, s.shake));

    ctx.globalCompositeOperation = "lighter";
    for (const p of s.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    ctx.lineCap = "round";
    for (const b of s.bullets) {
      const tailX = b.x - b.vx * .018, tailY = b.y - b.vy * .018;
      ctx.strokeStyle = "rgba(74, 168, 255, .35)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();
      ctx.strokeStyle = "#e6f3ff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    for (const shot of s.enemyShots) {
      ctx.fillStyle = shot.color;
      ctx.globalAlpha = .3;
      circle(shot.x, shot.y, 8);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#fff";
      circle(shot.x, shot.y, 3);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    for (const e of s.enemies) drawEnemy(e, now);
    for (const p of s.powerups) drawPowerup(p, now);
    if (!s.over) drawShip(now);

    ctx.font = "500 11px 'Martian Mono', ui-monospace, monospace";
    ctx.textAlign = "center";
    for (const t of s.texts) {
      ctx.globalAlpha = Math.min(1, t.life * 2);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text.toUpperCase(), t.x, t.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function isOverContent(x, y) {
    const title = document.getElementById("name").getBoundingClientRect();
    const list = document.getElementById("accounts").getBoundingClientRect();
    const pad = 12;
    return x >= Math.min(title.left, list.left) - pad
      && x <= Math.max(title.right, list.right) + pad
      && y >= title.top - pad
      && y <= list.bottom + pad;
  }

  addEventListener("resize", () => running && resize());

  addEventListener("pointermove", (e) => {
    if (!running || state.over) return;
    const { ship } = state;
    const dx = e.clientX - ship.targetX;
    const dy = e.clientY - ship.targetY;
    const dist = Math.hypot(dx, dy);

    ship.targetX = e.clientX;
    ship.targetY = e.clientY;
    if (dist > .5) {
      state.distanceMoved += dist;
      state.lastMove = performance.now();
      if (dist > 2) ship.targetAngle = Math.atan2(dy, dx);
    }
  });

  document.addEventListener("click", (e) => {
    if (running) return stop();
    if (e.target.closest("a, button, .toast") || isOverContent(e.clientX, e.clientY)) return;
    start(e.clientX, e.clientY);
  });

  addEventListener("keydown", (e) => {
    if (running && e.key === "Escape") stop();
  });
}

if (!reducedMotion) scrambleTitle();
renderAccounts();
startStars();
setupGame();
</script>
